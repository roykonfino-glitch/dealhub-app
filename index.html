/* ══════════════════════════════════════════════════════════════════
   DH2.1 DESIGN TOKENS — mirrors the Figma "Colors (Semantic Tokens)"
   collection (Light + Dark modes), Sizes, and the Elevation shadows.
   Source: DealHub Design System 2.1 (ED12XAjS0VYhGmHmTB4j9m)
══════════════════════════════════════════════════════════════════ */
:root{
  /* background/* */
  --background-primary-page:#FFFFFF;      /* background/primary/page */
  --background-overlay:#FFFFFF;           /* background/overlay/default — cards */
  --background-secondary:#F4F5F6;         /* background/secondary/default */
  --background-nav-bar:#FFFFFF;           /* background/nav-bar/default */
  --background-sub-header:#F5F8FD;        /* background/sub-header/default */
  --background-side-menu:#FAFBFC;         /* background/side-menu/default */
  --background-inset:#FAFBFC;             /* Gray/50 — subtle inset panels */
  --background-input:#FFFFFF;             /* background/input/default */
  --background-input-hover:#F8F9FA;       /* background/input/hover */
  --background-input-disabled:#F0F1F3;    /* background/input/disabled */
  --background-separator:#DCDDE0;         /* background/separator */
  --background-dropdown-hover:#F8F9FA;    /* background/dropdown-item/hover */
  /* border/* */
  --border-default:#EBECED;               /* border/default */
  --border-hover:#545A62;                 /* border/hover */
  --border-focus:#13171D;                 /* border/focus */
  --border-disabled:#DCDDE0;              /* border/disabled */
  --border-input:#EBECED;                 /* border/input/default */
  --border-input-hover:#3D434B;           /* border/input/hover */
  --border-input-focus:#13171D;           /* border/input/focus */
  --border-input-error:#F94D32;           /* border/input/error */
  /* text/* */
  --text-primary:#13171D;                 /* text/primary */
  --text-secondary:#545A62;               /* text/secondary */
  --text-subtitle:#686E76;                /* text/subtitle */
  --text-disabled:#B7BAC0;                /* text/disabled */
  --text-oncolor:#FFFFFF;                 /* text/primary-oncolor */
  --text-placeholder:#686E76;             /* text/input/default */
  --text-input:#3D434B;                   /* text/input/selected */
  --text-link:#1890FF;                    /* text/link/default */
  --text-link-hover:#04297A;              /* text/link/hover */
  --text-info:#1890FF;                    /* text/info-default */
  --text-error:#F94D32;                   /* text/error-default */
  --text-success:#1FBC70;                 /* text/success-default */
  /* buttons */
  --btn-primary:#1890FF;--btn-primary-hover:#0C53B7;
  --btn-error:#F94D32;--btn-error-hover:#BF2A00;
  --btn-disabled-bg:#F0F1F3;--btn-disabled-text:#B7BAC0;--btn-disabled-border:#DCDDE0;
  --btn-outline-bg:#FFFFFF;--btn-outline-bg-hover:#13171D;
  --btn-outline-text:#13171D;--btn-outline-text-hover:#FFFFFF;
  --btn-outline-border:#13171D;--btn-outline-border-disabled:#8E9298;
  /* selection (blue family — no legacy purple) */
  --selected-bg:rgba(24,144,255,.08);     /* Blue/500 @8% */
  --selected-tint:rgba(24,144,255,.05);
  --selected-border:#1890FF;              /* Blue/500 */
  --table-header-bg:#EBECED;              /* background/table/header-row/grey */
  --table-row-bg:#FFFFFF;                 /* background/table/row/default */
  --table-row-hover:#F7F7FF;              /* background/table/row/hover */
  --table-row-selected:#F0F0FB;           /* background/table/row/selected — Purple/100 */
  --table-row-selected-border:#8E9298;    /* border/table/row/selected — Gray/500 */
  --table-hdr-sep:#FFFFFF;                /* border/table/table-header-cell/white */
  --action-btn-hover:#EBECED;             /* background/action-button/hover — Gray/250 */
  --tooltip-bg:#13171D;                   /* dh-tooltip Theme=Dark — Gray/1000 */
  --tooltip-text:#FFFFFF;                 /* text/tooltip/black */
  --input-action-bg:#F4F5F6;              /* background/input-action/default — Gray/150 */
  --input-action-hover:#3D434B;           /* background/input-action/hover — Gray/800 */
  --dp-placeholder:#686E76;               /* text/date-picker/placeholder — Gray/600 */
  --dp-label:#B7BAC0;                     /* text/date-picker/label — Gray/400 */
  --dp-selected:#1890FF;                  /* background/date-picker/selected — Blue/500 */
  --dp-today:#1890FF;                     /* text/date-picker/today */
  --logo-tile-bg:#FFFFFF;                 /* dh-brand-symbol Background=White */
  --logo-tile-symbol:#163C70;             /* dh-brand-symbol Symbol=Blue — Navy/700 */
  --avatar-bg:#163C70;                    /* background/brand/primary — Navy/700 */
  --avatar-text:#FFFFFF;                  /* text/primary-oncolor */
  --menu-item-hover:#F0F1F3;              /* background/side-menu/menu-item/hover — Gray/200 */
  /* icon/* — DH2.1 icon role tokens */
  --icon-primary:#13171D;                 /* icon/primary — Gray/1000 */
  --icon-secondary:#545A62;               /* icon/secondary — Gray/700 */
  --icon-on-bg:#FFFFFF;                   /* icon/on-bg — White/1000 */
  --icon-disabled:#B7BAC0;                /* icon/disabled — Gray/400 */
  --icon-info:#1890FF;                    /* icon/info — Blue/500 */
  --icon-warning:#FFC902;                 /* icon/warning — Yellow/500 */
  --icon-caution:#FF994C;                 /* icon/caution — Orange/500 */
  --icon-success:#1FBC70;                 /* icon/success — Green/500 */
  --icon-error:#F94D32;                   /* icon/error — Red/500 */
  --icon-recurring:#704ADC;               /* icon/recurring — Purple/500 */
  /* badges — background/badge/* + text/badge/* (default tinted style) */
  --badge-primary-bg:rgba(24,144,255,.16);--badge-primary-text:#1890FF;
  --badge-secondary-bg:rgba(112,74,220,.12);--badge-secondary-text:#704ADC;   /* Purple/T12% + Purple/500 */
  --badge-success-bg:rgba(31,188,112,.16);--badge-success-text:#1FBC70;
  --badge-warning-bg:rgba(255,201,2,.16);--badge-warning-text:#DE9500;
  --badge-caution-bg:rgba(255,153,76,.16);--badge-caution-text:#E87428;
  --badge-error-bg:rgba(249,77,50,.16);--badge-error-text:#F94D32;
  --badge-info-bg:rgba(12,83,183,.12);--badge-info-text:#04297A;
  --badge-light-bg:rgba(142,146,152,.16);--badge-light-text:#545A62;
  /* message bars — background|text|border/message-bar/* */
  --mb-info-bg:#F5FAFF;--mb-info-border:#1890FF;--mb-info-text:#04297A;
  --mb-success-bg:#F1FDF6;--mb-success-border:#1FBC70;--mb-success-text:#10864B;
  --mb-warning-bg:#FFF3E1;--mb-warning-border:#FF994C;--mb-warning-text:#C05615;
  --mb-error-bg:#FFEBEB;--mb-error-border:#F94D32;--mb-error-text:#BF2A00;
  --mb-alert-bg:#FFFCEF;--mb-alert-border:#FFC902;--mb-alert-text:#DE9500;
  /* progress-bar/* */
  --progress-track:#DCDDE0;--progress-success:#1FBC70;--progress-warning:#FFC902;--progress-caution:#E87428;--progress-error:#F94D32;--progress-workflow:#1890FF;
  /* tag/grey/* (dh-tag) */
  --tag-bg:#EBECED;--tag-text:#13171D;
  /* slide-toggle/* */
  --toggle-on:#1890FF;--toggle-off:#8E9298;--toggle-thumb:#FFFFFF;--toggle-disabled:#DCDDE0;
  /* brand + AI */
  --brand-primary:#163C70;                /* background/brand/primary (Navy/700) */
  --brand-secondary:#22D1AF;              /* background/brand/secondary (Teal/500) */
  --brand-text:#3D6999;                   /* text/brand/primary (Navy/600) */
  --ai-1:#1890FF;--ai-2:#68F2D7;--ai-3:#09143A;  /* background/ai/gradient-color-1..3 */
  --ai-border:#704ADC;                    /* border/ai/primary — Purple/500 */
  --ai-icon:#704ADC;                      /* icon/ai/primary — Purple/500 */
  --ai-text:#163C70;                      /* text/ai/primary */
  --ai-tint:rgba(24,144,255,.06);
  --ai-hover:#F5FAFF;
  --logo-color:#163C70;                   /* dh-brand-logo Color=Blue */
  /* Elevation shadow colors — background/shadow/* */
  --shadow-key:rgba(20,20,20,.05);--shadow-ambient:rgba(142,146,152,.16);
  --shadow-key-dark:rgba(20,20,20,.08);--shadow-ambient-dark:rgba(20,20,20,.12);

  /* ── legacy aliases (kept so existing inline styles resolve to DH2.1) ── */
  --primary-dim:rgba(24,144,255,.08);
  --primary-glow:rgba(24,144,255,0);
}
[data-theme="dark"]{
  --background-primary-page:#13171D;
  --background-overlay:#1C2128;
  --background-secondary:#3D434B;
  --background-nav-bar:#1C2128;
  --background-sub-header:#1C2128;
  --background-side-menu:#13171D;
  --background-inset:#13171D;
  --background-input:#1C2128;
  --background-input-hover:#3D434B;
  --background-input-disabled:#3D434B;
  --background-separator:#545A62;
  --background-dropdown-hover:#3D434B;
  --border-default:#3D434B;
  --border-hover:#8E9298;
  --border-focus:#B7BAC0;
  --border-disabled:#545A62;
  --border-input:#3D434B;
  --border-input-hover:#8E9298;
  --border-input-focus:#B7BAC0;
  --border-input-error:#FFB2A0;
  --text-primary:#F8F9FA;
  --text-secondary:#B7BAC0;
  --text-subtitle:#B7BAC0;
  --text-disabled:#686E76;
  --text-placeholder:#B7BAC0;
  --text-input:#F0F1F3;
  --text-link:#70CDFF;
  --text-link-hover:#CCF3FF;
  --text-info:#70CDFF;
  --text-error:#FFB2A0;
  --text-success:#60DFA6;
  --btn-primary:#1890FF;--btn-primary-hover:#70CDFF;
  --btn-error:#F94D32;--btn-error-hover:#FFB2A0;
  --btn-disabled-bg:#3D434B;--btn-disabled-text:#686E76;--btn-disabled-border:#545A62;
  --btn-outline-bg:#13171D;--btn-outline-bg-hover:#3D434B;
  --btn-outline-text:#FAFBFC;--btn-outline-text-hover:#FFFFFF;
  --btn-outline-border:#B7BAC0;--btn-outline-border-disabled:#686E76;
  --selected-bg:rgba(24,144,255,.16);
  --selected-tint:rgba(24,144,255,.10);
  --selected-border:#70CDFF;
  --table-header-bg:#3D434B;
  --table-row-bg:#13171D;                 /* background/table/row/default */
  --table-row-hover:#3D434B;              /* background/table/row/hover */
  --table-row-selected:#3D434B;           /* background/table/row/selected — Gray/800 */
  --table-row-selected-border:#8E9298;    /* border/table/row/selected — Gray/500 */
  --table-hdr-sep:#545A62;                /* border/table/table-header-cell — Gray/700 */
  --action-btn-hover:#3D434B;             /* background/action-button/hover — Gray/800 */
  --tooltip-bg:#FAFBFC;                   /* dh-tooltip Theme=Light on dark UI */
  --tooltip-text:#13171D;
  --input-action-bg:#3D434B;              /* background/input-action/default — Gray/800 */
  --input-action-hover:#545A62;           /* background/input-action/hover — Gray/600 */
  --dp-placeholder:#B7BAC0;
  --dp-label:#545A62;                     /* Gray/700 on dark */
  --dp-selected:#1890FF;
  --dp-today:#70CDFF;
  --logo-tile-bg:transparent;             /* dark: symbol only, no tile background */
  --logo-tile-symbol:#22D1AF;             /* dh-brand-symbol Symbol=Teal */
  --avatar-bg:#6091BF;                    /* background/brand/primary — Navy/500 */
  --avatar-text:#FFFFFF;
  --menu-item-hover:#3D434B;              /* background/side-menu/menu-item/hover — Gray/800 */
  /* icon/* — dark mode */
  --icon-primary:#F8F9FA;--icon-secondary:#B7BAC0;--icon-on-bg:#FFFFFF;--icon-disabled:#686E76;
  --icon-info:#1890FF;--icon-warning:#FFE278;--icon-caution:#FF994C;--icon-success:#60DFA6;
  --icon-error:#FFB2A0;--icon-recurring:#9A7BF0;
  --badge-primary-bg:rgba(24,144,255,.32);--badge-primary-text:#CCF3FF;
  --badge-secondary-bg:rgba(112,74,220,.32);--badge-secondary-text:#EDE7FF;   /* Purple/T32% + Purple/300 */
  --badge-success-bg:rgba(31,188,112,.32);--badge-success-text:#E1FDEF;
  --badge-warning-bg:rgba(255,201,2,.32);--badge-warning-text:#FFE278;
  --badge-caution-bg:rgba(255,153,76,.32);--badge-caution-text:#FFDEBD;
  --badge-error-bg:rgba(249,77,50,.32);--badge-error-text:#FFB2A0;
  --badge-info-bg:rgba(12,83,183,.32);--badge-info-text:#70CDFF;
  --badge-light-bg:rgba(255,255,255,.3);--badge-light-text:#DCDDE0;
  --mb-info-bg:rgba(24,144,255,.32);--mb-info-border:#70CDFF;--mb-info-text:#CCF3FF;
  --mb-success-bg:rgba(31,188,112,.32);--mb-success-border:#60DFA6;--mb-success-text:#E1FDEF;
  --mb-warning-bg:rgba(255,153,76,.32);--mb-warning-border:#FF994C;--mb-warning-text:#FFDEBD;
  --mb-error-bg:rgba(249,77,50,.32);--mb-error-border:#FFB2A0;--mb-error-text:#FFECE9;
  --mb-alert-bg:rgba(255,201,2,.32);--mb-alert-border:#FFE278;--mb-alert-text:#FFF9E2;
  --progress-track:#545A62;--progress-success:#60DFA6;--progress-warning:#FFE278;--progress-caution:#FF994C;--progress-error:#FFB2A0;--progress-workflow:#70CDFF;
  --tag-bg:#3D434B;--tag-text:#F8F9FA;
  --toggle-on:#1890FF;--toggle-off:#8E9298;--toggle-thumb:#FAFBFC;--toggle-disabled:#545A62;
  --brand-primary:#6091BF;
  --brand-secondary:#ADF7E9;
  --brand-text:#F5F8FD;
  --ai-1:#70CDFF;--ai-2:#68F2D7;--ai-3:#6091BF;
  --ai-border:#9A7BF0;--ai-icon:#9A7BF0;--ai-text:#F5F8FD;   /* border|icon/ai/primary — Purple/400 */
  --ai-tint:rgba(24,144,255,.14);
  --ai-hover:#3D434B;
  --logo-color:#22D1AF;                   /* dh-brand-logo Color=Teal */
  --shadow-key:rgba(20,20,20,.4);--shadow-ambient:rgba(20,20,20,.5);
  --shadow-key-dark:rgba(20,20,20,.5);--shadow-ambient-dark:rgba(20,20,20,.6);
  --primary-dim:rgba(24,144,255,.16);
}
:root{
  /* Elevation composites — Shadows collection */
  --elev-widget:0 1px 2px 0 var(--shadow-key),0 2px 8px 0 var(--shadow-ambient);
  --elev-nav-bar:0 1px 3px 0 var(--shadow-key),0 4px 12px 0 var(--shadow-ambient);
  --elev-tooltip:0 2px 4px 0 var(--shadow-key),0 5px 11px -1px var(--shadow-ambient);
  --elev-menu:0 2px 6px 0 var(--shadow-key),0 4px 16px 0 var(--shadow-ambient);
  --elev-floating:0 4px 12px -2px var(--shadow-key),0 12px 28px -6px var(--shadow-ambient);
  --elev-modal:0 8px 16px 0 var(--shadow-key-dark),0 24px 48px 0 var(--shadow-ambient-dark);
}

body{font-family:'Roboto',-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:var(--background-primary-page);color:var(--text-primary);font-size:14px;line-height:1.4;-webkit-font-smoothing:antialiased;min-height:100vh;transition:background .2s,color .2s}

/* ── Icons (DH2.1 icon set, 24px grid, currentColor) ── */
.ic{display:inline-block;vertical-align:-0.15em;flex-shrink:0;fill:currentColor}
.ic-btn{vertical-align:-0.125em}

/* ── Header (nav-bar) — Elevation/nav-bar, no stroke ── */
.hdr{background:var(--background-nav-bar);box-shadow:var(--elev-nav-bar);padding:0 24px;height:56px;position:sticky;top:0;z-index:30;display:flex;align-items:center;justify-content:space-between;gap:12px}
.logo{display:flex;align-items:center;gap:12px;cursor:pointer}
.logo-svg{height:18px;width:auto;color:var(--logo-color);display:block}
.logo-tile{width:38px;height:38px;display:block;flex-shrink:0}
.logo-sep{width:1px;height:24px;background:var(--background-separator)}
.logo-name{font-size:14px;font-weight:600;color:var(--text-primary);letter-spacing:0}
.logo-sub{font-size:12px;color:var(--text-secondary);margin-top:0}
.hdr-co{display:flex;align-items:center;gap:8px;font-size:12px;color:var(--text-secondary)}
.hdr-co span{color:var(--text-secondary)}
.hdr-co input{background:var(--background-input);border:1px solid var(--border-input);color:var(--text-input);border-radius:6px;padding:6px 12px;font-size:13px;outline:none;width:180px;font-family:inherit;transition:border-color .15s,background .15s}
.hdr-co input::placeholder{color:var(--text-placeholder)}
.hdr-co input:hover{border-color:var(--border-input-hover)}
.hdr-co input:focus{border-color:var(--border-input-focus)}

/* ── User menu — dh-user-profile-menu pattern (avatar + dropdown, Elevation/menu) ── */
.um{position:relative}
.um-btn{display:flex;align-items:center;gap:8px;background:none;border:none;cursor:pointer;padding:4px 6px;border-radius:6px;font-family:inherit;transition:background .15s}
.um-btn:hover{background:var(--menu-item-hover)}
.um-av{width:32px;height:32px;border-radius:9999px;background:var(--avatar-bg);color:var(--avatar-text);display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:600;letter-spacing:.3px;flex-shrink:0}
.um-name{font-size:13px;font-weight:600;color:var(--text-primary);line-height:1.25;text-align:left}
.um-role{font-size:11px;color:var(--text-secondary);line-height:1.25;text-align:left}
.um-chev{color:var(--icon-secondary);display:flex;transition:transform .15s}
.um.open .um-chev{transform:rotate(180deg)}
/* dh-user-profile-menu (node 886:878): 330w, radius 16, pad 16, centered 72px avatar,
   "Hi, name" 18 SemiBold, email Text M secondary, items 32h Text S, Sign Out in error */
.um-menu{display:none;position:absolute;top:calc(100% + 6px);right:0;width:330px;background:var(--background-overlay);border:1px solid var(--border-default);border-radius:16px;box-shadow:var(--elev-menu);padding:16px;z-index:80}
.um.open .um-menu{display:block}
.um-hd{display:flex;flex-direction:column;align-items:center;gap:8px;padding:12px 0 6px;text-align:center}
.um-av-lg{width:72px;height:72px;font-size:24px}
/* _dh-profile-picture: 72px avatar; Default = edit bubble; Hover = dim overlay + upload/trash */
.um-avatar{position:relative;width:72px;height:72px;cursor:pointer}
img.um-av-img{width:72px;height:72px;border-radius:9999px;object-fit:cover;display:block}
img.um-av{object-fit:cover}
.um-dim{position:absolute;inset:0;border-radius:9999px;background:var(--text-primary);opacity:0;transition:opacity .15s;pointer-events:none}
.um-avatar:hover .um-dim{opacity:.4}
/* dh-input-action atom: 24px circle, Gray/150 bg, 0 2 6 25% shadow */
.ia{width:24px;height:24px;border-radius:9999px;background:var(--input-action-bg);border:none;display:flex;align-items:center;justify-content:center;color:var(--icon-secondary);box-shadow:0 2px 6px rgba(0,0,0,.25);cursor:pointer;padding:0;transition:background .12s,color .12s,opacity .15s}
.ia:hover{background:var(--input-action-hover);color:var(--text-oncolor)}
/* Rest state shows nothing; hover reveals upload (bottom-right) + remove (bottom-left, photo only) */
.um-avatar .ia{position:absolute;opacity:0;pointer-events:none}
.um-avatar:hover .ia{opacity:1;pointer-events:auto}
.ia-up{right:-2px;bottom:-2px}
.ia-del{left:-2px;bottom:-2px}
/* menu-item icon slot — 24px like _dh-menu-list, so labels align across items */
.mi-ic{width:24px;height:24px;display:flex;align-items:center;justify-content:center;flex-shrink:0;color:var(--icon-primary,var(--text-primary))}
.um-hi{font-size:18px;font-weight:600;color:var(--text-primary);line-height:21px}
.um-mail{font-size:14px;color:var(--text-secondary);line-height:20px}
.um-x{position:absolute;top:12px;right:12px;width:28px;height:28px;border:none;background:transparent;border-radius:6px;color:var(--icon-primary,var(--text-primary));cursor:pointer;display:flex;align-items:center;justify-content:center}
.um-x:hover{background:var(--menu-item-hover)}
.um-signout,.um-signout .ic{color:var(--text-error)}
.um-sep{height:1px;background:var(--border-default);margin:4px 2px 6px}
.um-item{display:flex;align-items:center;gap:8px;width:100%;background:none;border:none;font-family:inherit;font-size:13px;color:var(--text-primary);padding:4px 8px;height:32px;border-radius:6px;cursor:pointer;text-align:left;transition:background .12s}
.um-item:hover{background:var(--menu-item-hover)}
.um-item .ic{color:var(--icon-secondary)}

/* ── Home — all discovery forms in one place (page bg = background/sub-header) ── */
#homeView{background:var(--background-sub-header);min-height:calc(100vh - 56px)}
.home{max-width:1240px;margin:0 auto;padding:32px 24px}
.home-hd{display:flex;align-items:flex-start;justify-content:space-between;gap:16px;margin-bottom:24px;flex-wrap:wrap}
.home-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:16px}
.fcard{background:var(--background-overlay);border:1px solid var(--border-default);border-radius:12px;padding:20px;cursor:pointer;display:flex;flex-direction:column;gap:14px;transition:border-color .15s,box-shadow .15s}
.fcard:hover{border-color:var(--border-hover);box-shadow:var(--elev-widget)}
.theme-sw{display:flex;align-items:center;gap:8px;background:none;border:none;cursor:pointer;padding:0}
.theme-sw .sw-ico{color:var(--text-secondary);display:flex}
.dh-sw{width:40px;height:22px;border-radius:16px;background:var(--toggle-off);position:relative;transition:background .2s;flex-shrink:0;display:inline-block}
.dh-sw::after{content:'';position:absolute;width:18px;height:18px;border-radius:9999px;background:var(--toggle-thumb);top:2px;left:2px;transition:transform .2s}
[data-theme="dark"] .dh-sw{background:var(--toggle-on)}
[data-theme="dark"] .dh-sw::after{transform:translateX(18px)}

/* ── Step progress — dh-wizard (32px circle, 2px stroke, Text M Bold) ── */
/* Wizard strip: connectors stretch (flex:1) so the stepper spans the content container;
   overflow-x stays as a narrow-screen fallback */
/* Aligned to the same 1240px content container as the page — first/last circles sit flush
   with the card edges; edge labels overhang into the side padding (visible, ≥24px) */
/* Vertical rhythm: 16px above the circles; labels overhang 22px into the 38px bottom
   padding, leaving the same 16px of air below them */
.prog{background:var(--background-sub-header);border-bottom:1px solid var(--border-default);padding:16px max(24px,(100% - 1192px)/2) 38px;display:flex;align-items:flex-start;gap:4px;overflow-x:auto;position:relative;z-index:10}
.prog::-webkit-scrollbar{height:0}
/* dh-wizard (node 239:293): 32px circles (2px stroke, radius 999), Text M Bold labels below,
   2px rounded connectors colored by the state of the step they lead to.
   done = icon/success fill + white check · active = primary outline + text/info · todo = border/disabled */
/* Step column is exactly the 32px circle, so connectors butt up against the circles
   (4px flex gap, like the component). Labels hang below, absolutely positioned,
   wrapping to a 2nd line so the full name is always shown. */
.ws{position:relative;flex:0 0 32px;width:32px;height:32px;cursor:pointer;background:none;border:none;padding:0;font-family:inherit;overflow:visible}
.ws-c{position:relative;width:32px;height:32px;border-radius:999px;border:2px solid var(--border-disabled);background:transparent;display:flex;align-items:center;justify-content:center;font-size:14px;font-weight:600;line-height:20px;color:var(--text-secondary);transition:all .2s}
.ws.done .ws-c{background:var(--icon-success);border-color:var(--icon-success);color:#FFFFFF}
.ws.active .ws-c{border-color:var(--selected-border);color:var(--text-info)}
.ws-dot{position:absolute;top:-3px;right:-3px;width:10px;height:10px;border-radius:9999px;background:var(--badge-secondary-text);border:2px solid var(--background-sub-header)}
/* Fixed-position dh-tooltip for the CSM dot — escapes .prog's overflow clipping */
.ws-tip-fixed{display:none;position:fixed;transform:translate(-50%,-100%);background:var(--tooltip-bg);color:var(--tooltip-text);font-size:14px;line-height:20px;padding:6px 12px;border-radius:6px;box-shadow:var(--elev-tooltip);white-space:nowrap;z-index:98;pointer-events:none}
.ws-tip-fixed.open{display:block}
.ws-tip-fixed::before{content:'';position:absolute;top:100%;left:50%;transform:translateX(-50%);border-left:4px solid transparent;border-right:4px solid transparent;border-top:4px solid var(--tooltip-bg)}
/* dark: check glyph in the strip's background color, per design feedback */
[data-theme="dark"] .ws.done .ws-c{color:var(--background-sub-header)}
/* Single-line labels: smaller type, centered under the circle, ellipsized ("…") when the
   responsive per-step width (11vw) can't fit the full name */
.ws-l{position:absolute;top:38px;left:50%;transform:translateX(-50%);width:max-content;max-width:min(132px,11vw);font-size:12px;font-weight:600;line-height:16px;color:var(--text-secondary);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;text-align:center}
.ws-l em{font-style:normal}
.ws.done .ws-l{color:var(--text-success)}
.ws.active .ws-l{color:var(--text-info)}
.ws-line{flex:1;min-width:10px;height:2px;border-radius:99px;background:var(--text-disabled);margin-top:15px}
.ws-line.done{background:var(--icon-success)}
.ws-line.active{background:linear-gradient(90deg,var(--icon-success) 0%,var(--selected-border) 70%)}
.pa{color:var(--text-disabled);font-size:12px;margin-left:4px}

/* ── Layout ── */
/* SaaS content container: center the work area at a fixed max width (1240px, same as Home)
   instead of stretching edge-to-edge — full-bleed bars (.prog/.footer) keep their background
   but align their inner content to the same container via computed side padding. */
.page{display:grid;grid-template-columns:1fr;min-height:calc(100vh - 96px)}
.content{padding:24px;overflow-y:auto;width:100%;max-width:1240px;margin:0 auto}
.aside{background:var(--background-side-menu);border-left:1px solid var(--border-default);padding:16px;display:flex;flex-direction:column}

/* ── Cards (background/overlay + Elevation/widget) ── */
.card{background:var(--background-overlay);border:1px solid var(--border-default);border-radius:12px;padding:24px;margin-bottom:16px;box-shadow:var(--elev-widget)}
.ptitle{font-size:22px;font-weight:500;margin-bottom:6px;line-height:1.2;color:var(--text-primary);letter-spacing:0}
.ptitle em{color:var(--btn-primary);font-style:normal;font-weight:600}
.psub{font-size:13px;color:var(--text-secondary);line-height:1.5;margin-bottom:24px;max-width:580px}
.slbl{font-size:12px;font-weight:600;color:var(--badge-secondary-text);text-transform:uppercase;letter-spacing:.6px;margin-bottom:8px;margin-top:16px}
.slbl:first-child{margin-top:0}
.shint{font-size:12px;color:var(--text-secondary);line-height:1.45;margin-bottom:10px}
.section-hdr-inline{font-size:12px;font-weight:600;color:var(--badge-secondary-text);text-transform:uppercase;letter-spacing:.6px;margin-bottom:8px;margin-top:0}

/* ── Inputs (dh-input: h40, 2px border, 16px LR padding, Text M) ── */
.inp,.sel,.ta{background:var(--background-input);border:2px solid var(--border-input);color:var(--text-input);border-radius:6px;padding:8px 16px;font-size:14px;line-height:20px;width:100%;outline:none;transition:border-color .15s;font-family:inherit}
.inp,.sel{height:40px;padding-top:0;padding-bottom:0}
.inp:hover,.ta:hover{border-color:var(--border-input-hover)}
.inp:focus,.ta:focus{border-color:var(--border-input-focus)}
.inp::placeholder,.ta::placeholder{color:var(--text-placeholder)}
.inp:disabled,.sel:disabled,.ta:disabled{background:var(--background-input-disabled);color:var(--text-disabled);border-color:var(--border-disabled)}
.sel{cursor:pointer}
.ta{resize:vertical;line-height:1.5}
.lbl{font-size:12px;color:var(--text-secondary);display:block;margin-bottom:4px;font-weight:500;letter-spacing:0}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.hr{border:none;border-top:1px solid var(--border-default);margin:24px 0}

/* ── Buttons (dh-button: M h32 pad 6/12, S h30 pad 4/10, Button M Regular 14/20) ── */
.btn{border:1.5px solid var(--btn-outline-border);background:var(--btn-outline-bg);color:var(--btn-outline-text);border-radius:6px;padding:6px 12px;font-size:14px;line-height:20px;height:32px;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:8px;transition:all .15s;font-weight:400;font-family:inherit;white-space:nowrap}
.btn:hover{background:var(--btn-outline-bg-hover);border-color:var(--btn-outline-bg-hover);color:var(--btn-outline-text-hover)}
.btn:disabled,.btn-p:disabled,.btn-ai:disabled{background:var(--btn-disabled-bg);color:var(--btn-disabled-text);border-color:var(--btn-disabled-border);cursor:default}
.btn:disabled:hover,.btn-p:disabled:hover{background:var(--btn-disabled-bg);color:var(--btn-disabled-text);border-color:var(--btn-disabled-border)}
.btn:focus-visible{outline:2px solid var(--border-input-focus);outline-offset:2px}
.btn-txt{background:transparent;border-color:transparent;color:var(--text-primary)}
.btn-txt:hover{background:var(--background-secondary);border-color:transparent;color:var(--text-primary)}
.btn-ic{background:transparent;border:none;color:var(--text-secondary);border-radius:6px;width:30px;height:30px;display:inline-flex;align-items:center;justify-content:center;cursor:pointer;padding:0}
.btn-ic:hover{background:var(--background-secondary);color:var(--text-primary)}
.btn:active:not(:disabled){transform:none}
.btn-p{background:var(--btn-primary);border-color:var(--btn-primary);color:var(--text-oncolor);font-weight:400}
.btn-p:hover{background:var(--btn-primary-hover);border-color:var(--btn-primary-hover);color:var(--text-oncolor)}
.btn-sm{padding:4px 10px;font-size:12px;line-height:22px;height:30px;border-radius:6px}
.btn-d{color:var(--text-error);border-color:var(--text-error);background:transparent;padding:4px 10px;font-size:12px;line-height:20px;height:30px}
.btn-d:hover{background:var(--btn-error);border-color:var(--btn-error);color:var(--text-oncolor)}
.btn-ai{background:linear-gradient(var(--background-overlay),var(--background-overlay)) padding-box,linear-gradient(100deg,var(--ai-1),var(--ai-2),var(--ai-3)) border-box;border:1.5px solid transparent;color:var(--ai-text);font-weight:500}
.btn-ai:hover{background:linear-gradient(var(--ai-hover),var(--ai-hover)) padding-box,linear-gradient(100deg,var(--ai-1),var(--ai-2),var(--ai-3)) border-box;color:var(--ai-text)}

/* ── dh-dropdown (custom select) ── */
.dd{position:relative;width:100%}
.dd-native{position:absolute!important;opacity:0;pointer-events:none;width:1px;height:1px;left:0;top:0}
.dd-trigger{background:var(--background-input);border:2px solid var(--border-input);color:var(--text-input);border-radius:6px;padding:0 16px;height:40px;font-size:14px;line-height:20px;width:100%;outline:none;cursor:pointer;font-family:inherit;display:flex;align-items:center;justify-content:space-between;gap:8px;text-align:left;transition:border-color .15s}
.dd-trigger:hover{border-color:var(--border-input-hover)}
.dd.open .dd-trigger{border-color:var(--border-input-focus)}
.dd-trigger:disabled{background:var(--background-input-disabled);color:var(--text-disabled);border-color:var(--border-disabled);cursor:default}
.dd-label{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;flex:1}
.dd-chev{color:currentColor;flex-shrink:0;display:flex;align-items:center;transition:transform .15s}
.dd.open .dd-chev{transform:rotate(180deg)}
.dd-menu{display:none;position:absolute;top:calc(100% + 4px);left:0;min-width:100%;background:var(--background-overlay);border:1px solid var(--border-default);border-radius:8px;box-shadow:var(--elev-menu);padding:8px;z-index:80;max-height:280px;overflow-y:auto}
.dd.open .dd-menu{display:block}
.dd-item{padding:8px;min-height:40px;border-radius:6px;font-size:14px;line-height:20px;color:var(--text-secondary);cursor:pointer;display:flex;align-items:center;justify-content:space-between;gap:10px;white-space:nowrap}
.dd-item:hover{background:var(--background-dropdown-hover)}
.dd-item.on{font-weight:600}
.dd-check{color:var(--text-primary);display:flex;align-items:center}
/* compact variant for table-embedded dropdowns */
.dd-sm .dd-trigger{height:32px;padding:0 10px;font-size:13px}
.dd-pill .dd-trigger{height:24px;padding:0 8px;border:none;border-radius:9999px;font-size:13px;gap:6px;width:auto}
.dd-sm .dd-item{min-height:32px;padding:6px 8px;font-size:13px}
/* ── dh multi-select input (autocomplete + tags) — used for Multi-Currency ── */
.msel{position:relative}
.msel-box{display:flex;flex-wrap:wrap;gap:6px;align-items:center;background:var(--background-input);border:2px solid var(--border-input);border-radius:6px;padding:5px 12px;min-height:40px;cursor:text;transition:border-color .15s}
.msel-box:hover{border-color:var(--border-input-hover)}
.msel.open .msel-box{border-color:var(--border-input-focus)}
.msel-in{flex:1;min-width:110px;border:none;outline:none;background:transparent;font-family:inherit;font-size:14px;line-height:20px;color:var(--text-input);height:24px;padding:0}
.msel-in::placeholder{color:var(--text-placeholder)}
/* dh-tag (DS component: Color=grey, Size=s, Icon=yes): pill radius, background/tag/grey,
   Text M Regular, trailing close icon — used verbatim inside the multi-select input */
.mtag{display:inline-flex;align-items:center;gap:6px;height:24px;background:var(--tag-bg);color:var(--tag-text);border-radius:9999px;padding:0 6px 0 12px;font-size:14px;line-height:20px;font-weight:400;white-space:nowrap}
.mtag-x{display:inline-flex;align-items:center;justify-content:center;width:18px;height:18px;border:none;background:none;color:var(--tag-text);cursor:pointer;border-radius:9999px;padding:0;flex-shrink:0}
.mtag-x:hover{background:rgba(19,23,29,.10)}
[data-theme="dark"] .mtag-x:hover{background:rgba(248,249,250,.14)}
.msel-menu{display:none;position:absolute;top:calc(100% + 4px);left:0;right:0;background:var(--background-overlay);border:1px solid var(--border-default);border-radius:8px;box-shadow:var(--elev-menu);padding:8px;z-index:80;max-height:240px;overflow-y:auto}
.msel.open .msel-menu{display:block}

/* ── Use case grid ── */
.uc-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.uc{background:var(--background-overlay);border:1px solid var(--border-default);border-radius:8px;padding:16px;cursor:pointer;transition:all .18s;user-select:none}
.uc:hover{border-color:var(--border-hover)}
.uc.on{border-color:var(--selected-border);background:var(--selected-bg)}
.uc-top{display:flex;align-items:flex-start;gap:10px}
.uc-ico{font-size:18px;flex-shrink:0;width:26px;text-align:center;margin-top:2px}
.uc-inf{flex:1}
.uc-n{font-size:13px;font-weight:600;margin-bottom:4px;color:var(--text-primary)}
.uc-d{font-size:12px;color:var(--text-secondary);line-height:1.45}
/* dh-checkbox (DS component, Size=18): the EXACT exported Figma glyphs — outline square
   (icon/secondary) unchecked, solid icon/info square with knocked-out check when checked.
   Rendered by dhCheckbox(on); shared by EVERY card multi-select. */
.dh-cb{width:18px;height:18px;flex-shrink:0;margin-top:1px;display:block}
.uc-det{margin-top:12px;padding-top:12px;border-top:1px solid var(--border-default)}
.uc-det-lbl{font-size:12px;font-weight:600;color:var(--badge-secondary-text);text-transform:uppercase;letter-spacing:.5px;margin-bottom:6px}

/* ── Slide toggle (dh-slide-toggle Size=40: track 40×22, thumb 16) ── */
.sw{position:relative;width:40px;height:22px;flex-shrink:0}
.sw input{opacity:0;width:0;height:0}
.sw-t{position:absolute;cursor:pointer;inset:0;background:var(--toggle-off);border-radius:9999px;transition:.2s;border:none}
.sw-t:before{content:'';position:absolute;width:16px;height:16px;left:3px;top:3px;background:var(--toggle-thumb);border-radius:9999px;transition:.2s}
input:checked+.sw-t{background:var(--toggle-on)}
input:checked+.sw-t:before{transform:translateX(18px)}
input:disabled+.sw-t{background:var(--toggle-disabled);cursor:default}

/* ── Upload dropzone ── */
.dz{border:2px dashed var(--border-disabled);border-radius:8px;padding:24px;text-align:center;cursor:pointer;transition:all .2s;background:var(--background-inset)}
.dz:hover,.dz.ov{border-color:var(--ai-border);background:var(--ai-tint)}
.fok{background:var(--mb-success-bg);border:1px solid var(--mb-success-border);border-radius:8px;padding:12px;display:flex;align-items:center;justify-content:space-between}

/* ── Message bars (dh-message-bar) ── */
.mb{border-radius:8px;padding:12px 12px;font-size:12px;line-height:1.5;border:1px solid}
.mb-info{background:var(--mb-info-bg);border-color:var(--mb-info-border);color:var(--mb-info-text)}
.mb-success{background:var(--mb-success-bg);border-color:var(--mb-success-border);color:var(--mb-success-text)}
.mb-warning{background:var(--mb-warning-bg);border-color:var(--mb-warning-border);color:var(--mb-warning-text)}
.mb-error{background:var(--mb-error-bg);border-color:var(--mb-error-border);color:var(--mb-error-text)}
.mb-alert{background:var(--mb-alert-bg);border-color:var(--mb-alert-border);color:var(--mb-alert-text)}

/* ── AI insight box ── */
.insight{background:var(--ai-tint);border:1px solid var(--ai-border);border-radius:8px;padding:12px 16px;font-size:12px;color:var(--text-primary);line-height:1.55;margin-top:12px}
.insight strong{color:var(--ai-text)}

/* ── Inline table (dh-table) ── */
.etbl{width:100%;border-collapse:collapse;font-size:12px;margin-top:10px}
.etbl th{background:var(--table-header-bg);color:var(--text-secondary);padding:0 10px;height:32px;text-align:left;font-size:12px;font-weight:600;text-transform:uppercase;border-bottom:1px solid var(--border-default);letter-spacing:.4px}
.etbl td{padding:4px 8px;height:32px;border-bottom:1px solid var(--border-default)}
/* dh-table 1:1 (nodes 3022:15465 / 3022:3510 / 3022:4390 / 2995:8156):
   header-row 44px grey, header cells Text M Bold + 1px separator (white light / Gray/700 dark);
   rows 40px, cells pad 0 16 Text M text/primary, 1px border/default bottom;
   states: hover Purple/50 · selected Purple/100 + 1px Gray/500 ring, radius 6;
   dh-checkbox 18px · dh-action-table-menu 36px round. */
.dh-tbl{border-collapse:separate;border-spacing:0 2px}  /* dh-table itemSpacing: 2px between header and every row */
.dh-tbl th{background:var(--table-header-bg);height:44px;padding:0 16px;text-align:left;font-size:14px;font-weight:600;color:var(--text-primary);white-space:nowrap;border-right:1px solid var(--table-hdr-sep)}
.dh-tbl th:first-child{border-radius:6px 0 0 6px}
.dh-tbl th:last-child{border-right:none;border-radius:0 6px 6px 0}
.dh-tbl td{height:40px;padding:0 16px;font-size:14px;color:var(--text-primary);background:var(--table-row-bg);border-bottom:1px solid var(--border-default)}
.dh-tbl td:first-child{border-radius:6px 0 0 6px}
.dh-tbl td:last-child{border-radius:0 6px 6px 0}
.dh-tbl tbody tr:hover td{background:var(--table-row-hover)}
.dh-tbl tr.sel td{background:var(--table-row-selected);border-bottom-color:transparent;box-shadow:inset 0 1px 0 var(--table-row-selected-border),inset 0 -1px 0 var(--table-row-selected-border)}
.dh-tbl tr.sel td:first-child{box-shadow:inset 0 1px 0 var(--table-row-selected-border),inset 0 -1px 0 var(--table-row-selected-border),inset 1px 0 0 var(--table-row-selected-border)}
.dh-tbl tr.sel td:last-child{box-shadow:inset 0 1px 0 var(--table-row-selected-border),inset 0 -1px 0 var(--table-row-selected-border),inset -1px 0 0 var(--table-row-selected-border)}
.dh-tbl tr.done td{color:var(--text-disabled)}
.th-sort{cursor:pointer;user-select:none}
.sic{display:inline-flex;margin-left:4px;color:var(--icon-secondary);vertical-align:-1px}
.sic.asc .ic{transform:rotate(180deg)}
.dh-tbl .cell-cb{width:42px;padding:0 12px}
.dh-tbl .cell-kb{width:52px;padding:0 8px;text-align:right;position:relative}
/* dh-checkbox — 18px: unchecked outline = icon/secondary, checked = icon/info (Blue/500) */
.tchk{appearance:none;-webkit-appearance:none;width:18px;height:18px;border:2px solid var(--icon-secondary);border-radius:4px;background:transparent;cursor:pointer;display:block;position:relative;transition:background .12s,border-color .12s;margin:0}
.tchk:checked{background:var(--selected-border);border-color:var(--selected-border)}
.tchk:checked::after{content:'';position:absolute;left:4px;top:1px;width:4px;height:8px;border:solid #fff;border-width:0 2px 2px 0;transform:rotate(45deg)}
/* dh-action-table-menu — 36px circular hover target */
.kb{width:36px;height:36px;border:none;border-radius:9999px;background:transparent;color:var(--icon-secondary);cursor:pointer;display:inline-flex;align-items:center;justify-content:center;padding:0;transition:background .12s}
.kb:hover{background:var(--menu-item-hover);color:var(--text-primary)}
.rowmenu{position:absolute;right:12px;top:calc(100% - 6px);min-width:190px;background:var(--background-overlay);border:1px solid var(--border-default);border-radius:8px;box-shadow:var(--elev-menu);padding:8px;z-index:70;display:none;text-align:left}
.rowmenu.open{display:block}
.etbl tbody tr:hover td{background:var(--background-secondary)}
.etbl input{background:transparent;border:none;color:var(--text-primary);font-size:12px;width:100%;outline:none;padding:2px 4px;font-family:inherit}
.etbl input:focus{background:var(--background-input-hover);border-radius:4px}

/* ── Tips sidebar ── */
.tips-wrap{display:flex;flex-direction:column;height:100%;min-height:calc(100vh - 130px)}
.tips-hdr{display:flex;align-items:center;gap:8px;margin-bottom:16px;padding-bottom:12px;border-bottom:1px solid var(--border-default)}
.tips-ttl{font-size:12px;font-weight:600;color:var(--text-primary)}
.tips-step{font-size:12px;color:var(--text-secondary);background:var(--background-secondary);border-radius:9999px;padding:2px 8px;margin-left:auto;font-weight:500;border:1px solid var(--border-default)}
.tip-card{border-radius:8px;padding:12px 12px;margin-bottom:8px}
.tip-card.tip-info{border-left:3px solid var(--mb-info-border);background:var(--mb-info-bg)}
.tip-card.tip-warn{border-left:3px solid var(--mb-alert-border);background:var(--mb-alert-bg)}
.tip-icon{font-size:13px;margin-bottom:4px}
.tip-text{font-size:12px;color:var(--text-primary);line-height:1.55}
.tip-text strong{color:var(--text-primary);font-weight:600}

/* ── Toast (Elevation/floating) ── */
.save-toast{position:fixed;bottom:70px;right:20px;background:var(--mb-success-bg);color:var(--mb-success-text);border:1px solid var(--mb-success-border);border-radius:8px;padding:8px 16px;font-size:12px;font-weight:600;z-index:99;opacity:0;transition:opacity .3s;pointer-events:none;box-shadow:var(--elev-floating)}
.save-toast.show{opacity:1}

/* ── Stats / Review ── */
.rev-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:24px}
.rev-c{background:var(--background-inset);border:1px solid var(--border-default);border-radius:8px;padding:16px;text-align:center}
.rev-n{font-size:24px;font-weight:800;color:var(--text-primary);line-height:32px}
.rev-l{font-size:12px;color:var(--text-secondary);margin-top:4px}

/* ── Badges (dh-badge Default: S h22 Text S Regular, L h24 Text M) ── */
.badge{display:inline-flex;align-items:center;justify-content:center;gap:4px;background:var(--badge-primary-bg);color:var(--badge-primary-text);border-radius:9999px;padding:2px 8px;font-size:13px;line-height:18px;font-weight:400;white-space:nowrap;align-self:center}
.badge-lg{font-size:14px;line-height:20px}
.badge-primary{background:var(--badge-primary-bg);color:var(--badge-primary-text)}
.badge-secondary{background:var(--badge-secondary-bg);color:var(--badge-secondary-text)}
.badge-success{background:var(--badge-success-bg);color:var(--badge-success-text)}
.badge-warning{background:var(--badge-warning-bg);color:var(--badge-warning-text)}
.badge-caution{background:var(--badge-caution-bg);color:var(--badge-caution-text)}
.badge-error{background:var(--badge-error-bg);color:var(--badge-error-text)}
.badge-info{background:var(--badge-info-bg);color:var(--badge-info-text)}
.badge-light{background:var(--badge-light-bg);color:var(--badge-light-text)}

/* ── Links ── */
a{color:var(--text-link)}
a:hover{color:var(--text-link-hover)}

/* Variant hovers declare all three paint props — the generic .btn:hover above
   otherwise leaks its outline-invert border/text onto them. */
.btn.btn-t{background:transparent;border-color:transparent}
.btn.btn-t:hover{background:var(--menu-item-hover);border-color:transparent;color:var(--btn-outline-text)}
.btn.btn-e{background:var(--btn-error);border-color:var(--btn-error);color:var(--text-oncolor)}
.btn.btn-e:hover{background:var(--btn-error-hover);border-color:var(--btn-error-hover);color:var(--text-oncolor)}
/* dh-action-button (Group=Drawer Row): 32px, transparent, radius 6, hover bg action-button/hover */
.abtn{width:32px;height:32px;border:none;border-radius:6px;background:transparent;color:var(--icon-secondary);cursor:pointer;display:inline-flex;align-items:center;justify-content:center;padding:0;flex-shrink:0;transition:background .12s,color .12s}
.abtn:hover{background:var(--action-btn-hover);color:var(--text-error)}

/* ── dh-input Variant=Date + dh-date-picker-dropdown (330×304, Elevation/menu) ── */
.dhdate{position:relative}
.dhdate .inp{cursor:pointer;padding-right:42px}
.dhdate-ic{position:absolute;right:14px;top:50%;transform:translateY(-50%);color:var(--icon-secondary);pointer-events:none;display:flex}
.dp{position:fixed;width:330px;background:var(--background-overlay);border:1px solid var(--border-default);border-radius:8px;box-shadow:var(--elev-menu);padding:8px 10px;z-index:96;display:none}
.dp.open{display:block}
.dp-toolbar{display:flex;align-items:center;gap:8px;padding:10px 0}
.dp-sel{position:relative;display:flex;align-items:center;justify-content:space-between;gap:8px;height:40px;border:2px solid var(--border-default);border-radius:6px;padding:0 12px 0 16px;font-size:14px;color:var(--dp-placeholder);background:var(--background-input);cursor:pointer;font-family:inherit}
.dp-sel:hover{border-color:var(--border-input-hover)}
.dp-sel .ic{color:var(--icon-secondary)}
.dp-sel-m{flex:1.6}.dp-sel-y{flex:1}
.dp-nav{width:24px;height:24px;border-radius:9999px;border:none;background:transparent;color:var(--icon-secondary);display:flex;align-items:center;justify-content:center;cursor:pointer;flex-shrink:0;padding:0}
.dp-nav:hover{background:var(--menu-item-hover);color:var(--text-primary)}
.dp-grid{display:grid;grid-template-columns:repeat(8,36px);gap:2px;justify-content:center}
.dp-wd,.dp-wn{height:36px;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:500;color:var(--dp-label)}
.dp-day{width:36px;height:36px;border-radius:9999px;border:none;background:transparent;font-size:14px;font-weight:500;font-family:inherit;color:var(--text-primary);cursor:pointer;display:flex;align-items:center;justify-content:center;padding:0;transition:background .1s}
.dp-day:hover{background:var(--menu-item-hover)}
.dp-day.out{color:var(--text-disabled)}
.dp-day.today{color:var(--dp-today)}
.dp-day.sel,.dp-day.sel:hover{background:var(--dp-selected);color:#FFFFFF}
.dp-list{position:absolute;top:calc(100% + 4px);left:0;min-width:100%;max-height:200px;overflow-y:auto;background:var(--background-overlay);border:1px solid var(--border-default);border-radius:8px;box-shadow:var(--elev-menu);padding:8px;z-index:97;display:none}
.dp-list.open{display:block}
.dp-li{display:block;width:100%;background:none;border:none;font-family:inherit;font-size:13px;color:var(--text-primary);padding:6px 10px;border-radius:6px;cursor:pointer;text-align:left}
.dp-li:hover{background:var(--menu-item-hover)}
.dp-li.cur{color:var(--dp-today);font-weight:600}

/* ── dh-modal (scrim + Elevation/modal surface) ── */
.modal-scrim{position:fixed;inset:0;z-index:90;background:var(--modal-scrim,rgba(19,23,29,.48));display:none;align-items:center;justify-content:center;padding:24px}
.modal-scrim.open{display:flex}
.modal{width:500px;max-width:100%;background:var(--background-overlay);border-radius:16px;box-shadow:var(--elev-modal);display:flex;flex-direction:column}
.modal-hd{display:flex;align-items:center;gap:10px;padding:16px 24px;border-bottom:1px solid var(--border-default)}
.modal-hd .ic-err{color:var(--text-error);flex-shrink:0;display:flex}
.modal-title{font-size:16px;font-weight:600;color:var(--text-primary);flex:1;min-width:0}
.modal-x{width:28px;height:28px;border:none;background:transparent;border-radius:6px;color:var(--icon-secondary);cursor:pointer;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.modal-x:hover{background:var(--menu-item-hover)}
.modal-bd{padding:16px 24px;font-size:14px;line-height:20px;color:var(--text-secondary)}
.modal-ft{display:flex;justify-content:flex-end;gap:16px;padding:16px 24px;border-top:1px solid var(--border-default)}

/* ── Login screen (mock auth — demo only, no real credentials are sent anywhere) ── */
.login{position:fixed;inset:0;z-index:60;display:none;align-items:center;justify-content:center;background:var(--background-sub-header);padding:24px;overflow-y:auto}
.login.open{display:flex}
.login-card{width:400px;max-width:100%;background:var(--background-overlay);border-radius:16px;box-shadow:var(--elev-floating);padding:40px 40px 32px;display:flex;flex-direction:column;gap:24px}
.login-brand{display:flex;flex-direction:column;align-items:center;gap:12px;text-align:center}
.login-brand .login-tile{width:56px;height:56px}
.login-title{font-size:20px;font-weight:600;color:var(--text-primary);line-height:24px}
.login-sub{font-size:13px;color:var(--text-secondary);margin-top:4px}
.login-f{display:flex;flex-direction:column;gap:16px}
.login-f>div{position:relative}
.inp.err,.login-f .inp.err{border-color:var(--border-input-error)}
/* dh-input State=Error helper-message: sits ON the bottom border (legend-style), its own
   background knocking the border out behind it — exactly like the DS component */
.inp-err-wrap{position:relative}
.inp-err-msg{position:absolute;bottom:-8px;left:12px;font-size:12px;line-height:16px;color:var(--text-error);background:var(--background-overlay);padding:0 4px;pointer-events:none}
/* DH2.1 input error helper (node 2008:12875): Text XS on input bg, pad 0 6,
   straddling the input's bottom border */
.login-err{display:none;position:absolute;left:10px;bottom:-8px;background:var(--background-input);padding:0 6px;font-size:12px;line-height:17px;color:var(--text-error);white-space:nowrap}
/* Error status icon inside the input, right side */
.inp-ic-err{display:none;position:absolute;right:12px;top:30px;color:var(--text-error);pointer-events:none}
.inp.err~.inp-ic-err{display:flex}
.inp.err{padding-right:40px}
/* dh-tooltip (Theme=Dark/Light per app theme, Position=Bottom): Text M 14/140% on Gray/1000,
   radius 6, 8x4 arrow, Elevation/tooltip */
.dh-tip{display:none;position:absolute;top:calc(100% + 6px);left:10px;background:var(--tooltip-bg);color:var(--tooltip-text);font-size:14px;line-height:20px;padding:6px 12px;border-radius:6px;box-shadow:var(--elev-tooltip);z-index:95;max-width:300px;white-space:normal}
.dh-tip.open{display:block}
.dh-tip::before{content:'';position:absolute;top:-4px;left:16px;border-left:4px solid transparent;border-right:4px solid transparent;border-bottom:4px solid var(--tooltip-bg)}
.login-or{display:flex;align-items:center;gap:12px;color:var(--text-secondary);font-size:12px}
.login-or::before,.login-or::after{content:"";flex:1;height:1px;background:var(--border-default)}
.btn.btn-lg{height:40px;width:100%;font-size:14px}
.login-note{text-align:center;font-size:12px;color:var(--text-secondary)}

/* ── Home KPI widget ── */
/* One joined summary widget — three divider-separated stat segments in a single container.
   The single full-width band keeps it distinct from the form-card grid below, while the
   tinted 40px icon chips + big-number hierarchy make each segment read as a stat tile. */
.mt-strip{display:grid;grid-template-columns:repeat(3,1fr);background:var(--background-overlay);border:1px solid var(--border-default);border-radius:12px;box-shadow:var(--elev-widget);margin-bottom:24px;overflow:hidden}
.mstat{display:flex;align-items:center;gap:14px;padding:16px 24px}
.mstat+.mstat{border-left:1px solid var(--border-default)}
.mstat-ic{width:40px;height:40px;border-radius:10px;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.mstat-n{font-size:24px;font-weight:700;color:var(--text-primary);line-height:1.1}
.mstat-l{font-size:13px;color:var(--text-secondary);margin-top:2px}
@media (max-width:720px){.mt-strip{grid-template-columns:1fr}.mstat+.mstat{border-left:none;border-top:1px solid var(--border-default)}}

/* ── Footer ── */
.footer{border-top:1px solid var(--border-default);background:var(--background-nav-bar);padding:12px max(24px,calc((100% - 1192px)/2));display:flex;justify-content:space-between;align-items:center;position:sticky;bottom:0;z-index:15}

/* ── Animations ── */
@keyframes bop{0%,60%,100%{transform:translateY(0)}30%{transform:translateY(-5px)}}
@keyframes spin{to{transform:rotate(360deg)}}
.spin{display:inline-block;width:12px;height:12px;border:2px solid rgba(24,144,255,.24);border-top-color:var(--btn-primary);border-radius:9999px;animation:spin .7s linear infinite}
.spin-dk{border-color:rgba(255,255,255,.35);border-top-color:var(--text-oncolor)}
.dot{width:5px;height:5px;border-radius:9999px;background:var(--btn-primary);animation:bop 1.2s infinite}
.dot:nth-child(2){animation-delay:.2s}.dot:nth-child(3){animation-delay:.4s}
</style>
</head>

<script>
const PX='https://dealhub-proxy.vercel.app/api/chat';
const uid=()=>Math.random().toString(36).slice(2,8);
const esc=s=>String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
const SAVE_KEY='dh_discovery_v3';
const FORMS_KEY='dh_forms_v1';   // index of all local discovery forms: [{id,co,crm,adminName,adminEmail,step,pct,submitted,updatedAt}]
function formsIndex(){try{return JSON.parse(localStorage.getItem(FORMS_KEY))||[]}catch(e){return[]}}
function saveFormsIndex(ix){try{localStorage.setItem(FORMS_KEY,JSON.stringify(ix))}catch(e){}}
function formKey(id){return SAVE_KEY+':'+id;}
// One-time migration: the pre-home-screen build kept a single form under SAVE_KEY.
// Adopt it as the first entry of the multi-form index, keyed by its own dbId.
function migrateLegacySave(){
  try{
    const raw=localStorage.getItem(SAVE_KEY);
    if(!raw)return;
    const saved=JSON.parse(raw);
    if(saved&&saved.st){
      const id=saved.st.dbId||uid()+uid();
      saved.st.dbId=id;
      localStorage.setItem(formKey(id),JSON.stringify(saved));
      const ix=formsIndex();
      if(!ix.some(f=>f.id===id)){
        let pct=0;
        try{const prev=st;st={...freshSt(),...saved.st};pct=scoreCompletion().pct;st=prev;}catch(e){}
        ix.unshift({id,co:saved.st.co||'',crm:saved.st.crm||'',adminName:saved.st.adminName||'',adminEmail:saved.st.adminEmail||'',step:saved.st.step||0,pct,submitted:!!saved.st.submitted,updatedAt:saved.ts||Date.now()});
      }
      saveFormsIndex(ix);
    }
    localStorage.removeItem(SAVE_KEY);
  }catch(e){console.warn('Legacy save migration failed:',e&&e.message);}
}

function applyTheme(t){
  document.documentElement.setAttribute('data-theme',t);
  const i=document.getElementById('themeIco');
  if(i)i.innerHTML=t==='dark'?dhIcon('sun',18):dhIcon('moon',18);
  const b=document.getElementById('themeBtn');

}

  try{localStorage.setItem('dh_theme',next);}catch(e){}
  applyTheme(next);
}

// ── DH-DROPDOWN — replaces native <select> option lists ────────────────────
// The native select stays in the DOM (hidden) so every existing inline
// onchange handler keeps working; the styled trigger + menu drive it.
function closeAllDD(except){document.querySelectorAll('.dd.open').forEach(d=>{if(d!==except)d.classList.remove('open');});}
document.addEventListener('click',()=>closeAllDD());
document.addEventListener('keydown',e=>{if(e.key==='Escape')closeAllDD();});
function enhanceSelects(root){
  (root||document).querySelectorAll('select').forEach(sel=>{
    if(sel.closest('.dd'))return;
    const wrap=document.createElement('div');wrap.className='dd';
    if(!sel.classList.contains('sel'))wrap.style.width='auto';
    if(sel.classList.contains('sel-sm'))wrap.classList.add('dd-sm');
    if(sel.classList.contains('sel-pill'))wrap.classList.add('dd-sm','dd-pill');
    sel.parentNode.insertBefore(wrap,sel);
    wrap.appendChild(sel);
    sel.classList.add('dd-native');
    const trig=document.createElement('button');
    trig.type='button';trig.className='dd-trigger';
    const inline=sel.getAttribute('style');
    if(inline)trig.setAttribute('style',inline.replace(/appearance[^;]*;?|-webkit-appearance[^;]*;?|background-image[^;]*;?|background-repeat[^;]*;?|background-position[^;]*;?|background-size[^;]*;?|padding-right[^;]*;?/g,''));
    trig.disabled=sel.disabled;
    trig.innerHTML='<span class="dd-label"></span><span class="dd-chev">'+dhIcon('chevron-down',12)+'</span>';
    const setLbl=()=>{const o=sel.options[sel.selectedIndex];trig.querySelector('.dd-label').textContent=(o&&o.text)||'Select…';};
    setLbl();
    wrap.appendChild(trig);
    trig.addEventListener('click',e=>{
      e.stopPropagation();
      if(trig.disabled)return;
      const wasOpen=wrap.classList.contains('open');
      closeAllDD();
      if(wasOpen)return;
      wrap.classList.add('open');
      let menu=wrap.querySelector('.dd-menu');
      if(!menu){menu=document.createElement('div');menu.className='dd-menu';wrap.appendChild(menu);}
      menu.innerHTML=Array.from(sel.options).map((o,i)=>
        `<div class="dd-item${i===sel.selectedIndex?' on':''}" data-i="${i}"><span>${esc(o.text)||'&nbsp;'}</span>${i===sel.selectedIndex?'<span class="dd-check">'+dhIcon('check-plain',14)+'</span>':''}</div>`).join('');
      menu.querySelectorAll('.dd-item').forEach(it=>{
        it.addEventListener('click',ev=>{
          ev.stopPropagation();
          sel.selectedIndex=+it.dataset.i;
          sel.dispatchEvent(new Event('change'));
          setLbl();
          wrap.classList.remove('open');
        });
      });
    });
    sel.addEventListener('change',setLbl);
  });
}

// ── SAVE & RESTORE ──────────────────────────────────────────────────────────
function saveState(){
  try{
    // Persist a SLIM copy. The rendered HTML of each doc version (~35KB each) and lastDocHtml
    // are fully derivable from `raw` via buildDocPage() (see verHtml), so we never store them —
    // once a few versions exist they'd blow the ~5MB localStorage budget and this write would
    // silently fail. skus can also be large; they're already session-only for DB resume.
    const slim={...st,
      docVersions:(st.docVersions||[]).map(v=>({id:v.id,versionNumber:v.versionNumber,raw:v.raw,createdAt:v.createdAt}))};
    delete slim.lastDocHtml;
    localStorage.setItem(formKey(st.dbId),JSON.stringify({st:slim,ts:Date.now()}));
    let pct=0;try{pct=scoreCompletion().pct;}catch(e){}
    const ix=formsIndex();
    const meta={id:st.dbId,co:st.co||'',crm:st.crm||'',adminName:st.adminName||'',adminEmail:st.adminEmail||'',step:st.step,pct,submitted:!!st.submitted,updatedAt:Date.now()};
    const i=ix.findIndex(f=>f.id===st.dbId);
    if(i>=0)ix[i]=meta;else ix.unshift(meta);
    saveFormsIndex(ix);
    return true;
  }catch(e){console.warn('Local save failed (likely storage quota):',e&&e.message);return false;}
}

  }catch(e){return false;}
}

function isoWeek(d){const t=new Date(Date.UTC(d.getFullYear(),d.getMonth(),d.getDate()));const dn=t.getUTCDay()||7;t.setUTCDate(t.getUTCDate()+4-dn);const y0=new Date(Date.UTC(t.getUTCFullYear(),0,1));return Math.ceil(((t-y0)/864e5+1)/7);}

async function syncToDb(submitted){
  const {pct}=scoreCompletion();
  const safe={...st};
  // Strip large binary blobs before sending to DB
  delete safe.skus;
  delete safe.productInsightLoading;
  delete safe.extractLoading;
  delete safe.docGenerating;
  delete safe.planLoading;
  delete safe.mmGenerating;
  // Rendered HTML is rebuilt from `raw` on load (verHtml), so keep it out of the DB payload too.
  delete safe.lastDocHtml;
  if(safe.docVersions)safe.docVersions=safe.docVersions.map(v=>({id:v.id,versionNumber:v.versionNumber,raw:v.raw,createdAt:v.createdAt}));
  return await sbUpsert({
    id:st.dbId,
    company:st.co||'Unnamed',
    csm:st.csm||null,
    industry:st.industry||null,
    crm:st.crm||null,

    updated_at:new Date().toISOString()
  });
}

// ── COMPLETION SCORE ────────────────────────────────────────────────────────
function scoreCompletion(){
  let score=0,max=0,gaps=[];
  const check=(val,label,w=10)=>{max+=w;if(val&&String(val).trim().length>1){score+=w;}else{gaps.push(label);}};
  check(st.co,'Company name',15);
  check(st.industry,'Industry',5);
  check(st.crm,'CRM',5);
  check(st.contractLength,'Contract length',5);
  check(st.goLive,'Go-live target',5);
  check(st.adminName,'DealHub admin name',10);
  if(st.skuCount>0){score+=10;max+=10;}else{max+=10;gaps.push('Product catalog');}
  check(st.pricingModel,'Pricing model',10);
  const enUC=st.useCases.filter(u=>u.on);
  if(enUC.length>0){score+=10;max+=10;}else{max+=10;gaps.push('Use cases');}
  const ucDetails=enUC.filter(u=>u.detail&&u.detail.length>20);
  if(ucDetails.length===enUC.length&&enUC.length>0){score+=10;max+=10;}
  else if(enUC.length>0){max+=10;gaps.push('Use case details (some too short)');}
  check(st.sellingFlow,'Quoting flow description',10);
if(st.approvalRows.length>0){score+=10;max+=10;}else{max+=10;gaps.push('Approval rules');}
  check(st.payTerms,'Payment terms',5);
  check(st.netDays,'Net days',5);
  const pct=Math.round(score/max*100);
  return{pct,gaps,score,max};
}

// ── AUTH — real Supabase Auth (email/password), REST calls to match the rest of
// this file's style (no supabase-js). Tokens live in localStorage — this app has
// no backend of its own, so the browser holds the session, same as everything
// else here holds its own state.
const SB_AUTH=`${SB_URL}/auth/v1`;
const AUTH_TOKEN_KEY='dh_sb_auth_v1';
function getAuthTokens(){try{return JSON.parse(localStorage.getItem(AUTH_TOKEN_KEY))||null}catch(e){return null}}
function setAuthTokens(t){try{t?localStorage.setItem(AUTH_TOKEN_KEY,JSON.stringify(t)):localStorage.removeItem(AUTH_TOKEN_KEY)}catch(e){}}

// Validates the stored session against Supabase, transparently refreshing an
// expired access token once before giving up. Returns the Supabase user object
// (or null) — never throws.
async function checkAuth(){
  let tok=getAuthTokens();
  if(!tok)return null;
  try{
    let res=await fetch(`${SB_AUTH}/user`,{headers:{apikey:SB_KEY,Authorization:'Bearer '+tok.access_token}});
    if(res.status===401&&tok.refresh_token){
      const r=await fetch(`${SB_AUTH}/token?grant_type=refresh_token`,{method:'POST',headers:{apikey:SB_KEY,'Content-Type':'application/json'},body:JSON.stringify({refresh_token:tok.refresh_token})});
      if(!r.ok){setAuthTokens(null);return null;}
      const d=await r.json();
      tok={access_token:d.access_token,refresh_token:d.refresh_token};
      setAuthTokens(tok);
      res=await fetch(`${SB_AUTH}/user`,{headers:{apikey:SB_KEY,Authorization:'Bearer '+tok.access_token}});
    }
    if(!res.ok){setAuthTokens(null);return null;}
    return await res.json();
  }catch(e){return null;}
}

  const btn=document.getElementById('loginBtn');

    const res=await fetch(`${SB_AUTH}/token?grant_type=password`,{
      method:'POST',
      headers:{apikey:SB_KEY,'Content-Type':'application/json'},
      body:JSON.stringify({email:val,password:pw.value}),

      passErr.textContent=data.error_description||data.msg||'Invalid email or password.';
      passErr.style.display='block';
      btn.disabled=false;btn.innerHTML=LOGIN_BTN_HTML;

  }
}

  try{ drawProg(); }catch(e){ console.error('drawProg error:',e); }
  try{
    const fns=[S1,S2,S3,S_RDS,S5,S_OutputDocs,S_PriceCalc,S6,S7_Plan];
    const stepFn=fns[st.step]||S1;
    const stepHtml=stepFn();
    const el=document.getElementById('content');
    if(el) el.innerHTML='<div>'+stepHtml+'</div>';
  }catch(e){
    console.error('Step render error:',e);
    const el=document.getElementById('content');
    if(el){const msg=String(e.message||'Unknown error');el.innerHTML='<div style="padding:48px;color:var(--text-error)"><b>Error:'+msg+'</b><br><button class="btn btn-sm" onclick="st.step=0;render()">Go to Step 1</button></div>';}
  }
  try{ drawFooter(); }catch(e){ console.error('footer:',e); }
  try{ drawTips(); }catch(e){ console.error('tips:',e); }
  try{ save(); }catch(e){ console.error('save error:',e); }
  // Freeze = a shared stop-accidental-edits switch (toggleFreeze()), NOT real per-user
  // access control — this app has no auth. Disables every data-entry control and primary
  // (mutating) button inside #content; secondary/nav buttons (View, Back, Continue) and the
  // Unfreeze button itself (class="btn", not "btn-p") stay clickable.
  if(st.frozen){
    try{
      const el=document.getElementById('content');
      if(el){
        const banner=document.createElement('div');
        banner.className='mb mb-alert';
        banner.style.cssText='margin-bottom:16px;display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap';
        banner.innerHTML='<span>'+dhIcon('lock',12)+' Frozen'+(st.frozenBy?' by '+esc(st.frozenBy):'')+(st.frozenAt?' on '+new Date(st.frozenAt).toLocaleString():'')+' — inputs are locked.</span><button class="btn btn-sm" onclick="toggleFreeze()">'+dhIcon('unlock',12,'ic-btn')+' Unfreeze</button>';
        el.insertBefore(banner,el.firstChild);
        el.querySelectorAll('input,select,textarea,button.btn-p,button.btn-ai,button.dd-trigger').forEach(x=>{x.disabled=true;});
      }
    }catch(e){console.error('freeze banner error:',e);}
  }
  // Auto-trigger generation on first arrival at Review (step 6) and Plan (step 7) — skip
  // while frozen so the freeze can't be bypassed by just revisiting the step.
  if(st.step===7&&!st.submitted&&!st.frozen&&!st.docGenerating&&!st.lastDocHtml&&!st.autoGenDocTriggered){
    st.autoGenDocTriggered=true;setTimeout(genDoc,800);
  }
  if(st.step===8&&!st.submitted&&!st.frozen&&!st.planLoading&&!(st.projectPlan&&st.projectPlan.length)&&!st.autoGenPlanTriggered){
    st.autoGenPlanTriggered=true;setTimeout(genProjectPlan,800);
  }
  try{ enhanceSelects(document.getElementById('content')); }catch(e){ console.error('dd error:',e); }
}

function drawProg(){
  // dh-wizard: step (circle + label below) alternating with connectors;
  // each connector takes the color of the step it leads INTO
  // Submitted forms are fully complete — every non-active circle shows done.
  // Step 9 (Project Plan) is done as soon as its table has been generated, even while on it.
  const planDone=!!(st.projectPlan&&st.projectPlan.length);
  const stateOf=i=>(i===STEPS.length-1&&planDone)?'done':i===st.step?'active':(i<st.step||st.submitted)?'done':'todo';
  document.getElementById('prog').innerHTML=STEPS.map((s,i)=>{
    const state=stateOf(i);
    // Done glyph = the exact 16px check exported from the _wizard-step Figma component;
    // currentColor keeps the light (white) / dark (strip-bg) color rules working
    const doneCheck='<svg width="16" height="16" viewBox="0 0 16 16" fill="none" aria-hidden="true"><path d="M14.334 5.48091L6.95831 12.6178C6.73703 12.8319 6.44657 12.9397 6.15611 12.9397C5.86564 12.9397 5.57518 12.8319 5.3539 12.6178L1.66618 9.04934C1.22238 8.6201 1.22238 7.92608 1.66618 7.49684C2.10977 7.06739 2.82679 7.06739 3.27058 7.49684L6.15611 10.289L12.7296 3.9284C13.1732 3.49896 13.8902 3.49896 14.334 3.9284C14.7776 4.35765 14.7776 5.05147 14.334 5.48091Z" fill="currentColor"/></svg>';
    const circle=state==='done'?doneCheck:(i+1);
    // CSM-only steps: purple dot on the circle; dh-tooltip shown via the fixed overlay
    // (.prog clips anything above it because of overflow-x:auto, so the tip can't live inside).
    // Hover trigger is the whole step button — the 10px dot alone is too small a target.
    const csmDot=s.csmOnly?'<span class="ws-dot"></span>':'';
    const csmHover=s.csmOnly?' onmouseenter="showWsTip(this)" onmouseleave="hideWsTip()"':'';
    const step='<button type="button" class="ws '+state+'" onclick="goStep('+i+')"'+csmHover+' aria-label="Step '+(i+1)+': '+esc(s.label)+(s.csmOnly?' (CSM internal)':'')+'"'+(state==='active'?' aria-current="step"':'')+'>'
      +'<span class="ws-c">'+circle+csmDot+'</span>'
      +'<span class="ws-l"><em>'+esc(s.label)+'</em></span>'
      +'</button>';
    const conn=i<STEPS.length-1?'<span class="ws-line '+stateOf(i+1)+'"></span>':'';
    return step+conn;
  }).join('');
}
// dh-tooltip for the CSM dot — a fixed-position singleton on <body>, anchored to the
// dot's rect, so .prog's overflow-x:auto can't clip it
function showWsTip(btn){
  const dot=btn.querySelector('.ws-dot');if(!dot)return;
  let tip=document.getElementById('wsTip');
  if(!tip){tip=document.createElement('div');tip.id='wsTip';tip.className='ws-tip-fixed';document.body.appendChild(tip);}
  tip.textContent='CSM internal step';
  const r=dot.getBoundingClientRect();
  tip.style.left=(r.left+r.width/2)+'px';
  tip.style.top=(r.top-8)+'px';
  tip.classList.add('open');
}
function hideWsTip(){
  const tip=document.getElementById('wsTip');
  if(tip)tip.classList.remove('open');
}
function drawFooter(){
  const last=st.step===STEPS.length-1;
  // Browsing an already-submitted form: same Back/Continue navigation, but the last page
  // exits to Home instead of re-submitting
  const lastBtn=st.submitted
    ?'<button class="btn btn-p" onclick="showHome()">'+dhIcon('arrow-left',14,'ic-btn')+' Back to all forms</button>'
    :'<button class="btn btn-p" onclick="submitForm()">Submit '+dhIcon('check-plain',14,'ic-btn')+'</button>';
  const btn=last?lastBtn:'<button class="btn btn-p" onclick="nextStep()">Continue '+dhIcon('arrow-right',14,'ic-btn')+'</button>';
  const dis=st.step===0?'disabled':'';
  document.getElementById('footer').innerHTML='<button class="btn" onclick="prevStep()" '+dis+'>'+dhIcon('arrow-left',14,'ic-btn')+' Back</button>'
    +'<span style="font-size:12px;color:var(--text-secondary)">'+(st.step+1)+' of '+STEPS.length+'</span>'
    +btn;
}
function goStep(i){st.step=i;render();window.scrollTo(0,0);}
function nextStep(){
  // Company name is required before leaving step 1 — it names the form everywhere (cards, doc)
  if(st.step===0&&!(st.co||'').trim()){
    st.coErr=true;render();
    const el=document.getElementById('coInp');
    if(el){el.scrollIntoView({block:'center'});el.focus();}
    return;
  }
  if(st.step<STEPS.length-1){st.step++;render();window.scrollTo(0,0);}
}
function prevStep(){if(st.step>0){st.step--;render();}}
function submitForm(){
  st.submitted=true;
  st.doneScreen=true; // show the confirmation now; later opens browse the pages
  saveState(); // keep it — Home lists submitted forms too
  syncToDb(true); // mark submitted in DB
  window.scrollTo(0,0); // land on the confirmation, not the footer
  render();
}

const CURRENCIES=['USD — US Dollar','EUR — Euro','GBP — British Pound','AUD — Australian Dollar','CAD — Canadian Dollar','JPY — Japanese Yen','CHF — Swiss Franc','ILS — Israeli Shekel','SEK — Swedish Krona','NOK — Norwegian Krone','DKK — Danish Krone','NZD — New Zealand Dollar','SGD — Singapore Dollar','HKD — Hong Kong Dollar','INR — Indian Rupee','BRL — Brazilian Real','MXN — Mexican Peso','ZAR — South African Rand','AED — UAE Dirham','PLN — Polish Zloty','CZK — Czech Koruna','TRY — Turkish Lira','KRW — South Korean Won','CNY — Chinese Yuan'];
function curList(){return (st.currencies||'').split(',').map(s=>s.trim()).filter(Boolean);}
function curTags(){return curList().map(c=>`<span class="mtag">${esc(c)}<button type="button" class="mtag-x" aria-label="Remove ${esc(c)}" onclick="event.stopPropagation();curRm('${esc(c)}')">${dhIcon('close',10)}</button></span>`).join('');}
function curOptions(q){
  const sel=curList();q=(q||'').toLowerCase();
  return CURRENCIES.filter(c=>!sel.includes(c.split(' — ')[0])).filter(c=>c.toLowerCase().includes(q));
}
function curMenuDraw(q){
  const menu=document.getElementById('curMenu');if(!menu)return;
  const opts=curOptions(q);
  menu.innerHTML=opts.length
    ?opts.map(c=>`<div class="dd-item" onmousedown="event.preventDefault();curAdd('${c.split(' — ')[0]}')"><span>${esc(c)}</span></div>`).join('')
    :`<div class="dd-item" style="cursor:default">No matches${(q||'').trim()?` — press Enter to add “${esc(q.trim().toUpperCase())}”`:''}</div>`;
}
// Targeted DOM sync (no full render): the input element survives, so typing focus is kept
function curSync(){
  const box=document.querySelector('#curMsel .msel-box');if(!box)return;
  box.querySelectorAll('.mtag').forEach(t=>t.remove());
  box.insertAdjacentHTML('afterbegin',curTags());
  const inp=document.getElementById('curIn');
  if(inp)inp.placeholder=curList().length?'Add currency…':'Type to search — e.g. USD, EUR, GBP';
  curMenuDraw(inp?inp.value:'');
}
// Open fully in view: list starts at the top (scrollTop=0) and the panel flips above
// the input when the space below is too small
function curPosition(){
  const m=document.getElementById('curMsel'),menu=document.getElementById('curMenu');
  if(!m||!menu)return;
  const r=m.getBoundingClientRect();
  const h=Math.min(menu.scrollHeight,240)+8;
  const below=window.innerHeight-r.bottom;
  if(below<h&&r.top>h){menu.style.top='auto';menu.style.bottom='calc(100% + 4px)';}
  else{menu.style.top='calc(100% + 4px)';menu.style.bottom='auto';}
  menu.scrollTop=0;
}
function curOpen(){const m=document.getElementById('curMsel');if(!m)return;m.classList.add('open');curMenuDraw((document.getElementById('curIn')||{}).value);curPosition();}
function curClose(){const m=document.getElementById('curMsel');if(m)m.classList.remove('open');}
function curFocus(){const i=document.getElementById('curIn');if(i){i.focus();curOpen();}}
function curType(v){const m=document.getElementById('curMsel');if(m)m.classList.add('open');curMenuDraw(v);curPosition();}
function curAdd(c){
  c=(c||'').trim().toUpperCase();if(!c)return;
  const l=curList();if(!l.includes(c))l.push(c);
  st.currencies=l.join(', ');save();
  const i=document.getElementById('curIn');if(i){i.value='';i.focus();}
  curSync();
}
function curRm(c){st.currencies=curList().filter(x=>x!==c).join(', ');save();curSync();}
function curKey(e){
  if(e.key==='Enter'){
    e.preventDefault();
    const q=e.target.value.trim();const opts=curOptions(q);
    if(opts.length)curAdd(opts[0].split(' — ')[0]);else if(q)curAdd(q);
  }else if(e.key==='Backspace'&&!e.target.value){
    const l=curList();if(l.length)curRm(l[l.length-1]);
  }else if(e.key==='Escape')curClose();
}
document.addEventListener('click',e=>{if(!e.target.closest('#curMsel'))curClose();});

async function extractApprovals(){
  const txt=(st.approvalText||'').trim();if(!txt){alert('Describe your approval process first.');return;}
  st.extractLoading=true;st.extractErr='';render();
  const sys=`You are a DealHub CPQ architect. Extract approval workflow configuration. Return ONLY valid JSON, no markdown.
{"matrix":[{"role":"...","max":"e.g. 10%","approver":"..."}],"rules":[{"rule":"DealHub-style condition e.g. If Payment Terms != Net 30","step1":"approver","step2":"optional second approver or empty string"}]}
Matrix: lowest to highest authority. max is discount ceiling as % string.
Rules: condition phrased as DealHub would. Include real names mentioned if any.`;
  try{
    const res=await fetch(PX,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({model:'claude-haiku-4-5-20251001',max_tokens:700,system:sys,messages:[{role:'user',content:txt}]})});
    const d=await res.json();
    if(d.error){st.extractErr=d.error.message;}
    else{
      const p=JSON.parse(((d.content&&d.content[0]?d.content[0].text:'')||'{}').replace(/```json|```/g,'').trim());
      if(p.matrix?.length)st.approvalRows=p.matrix.map(r=>({role:r.role||'',max:r.max||'',approver:r.approver||''}));
      if(p.rules?.length)st.ruleRows=p.rules.map(r=>({rule:r.rule||'',step1:r.step1||'',step2:r.step2||''}));
      pushAI(`Extracted <strong>${st.approvalRows.length} discount tiers</strong> and <strong>${st.ruleRows.length} rule-based workflow${st.ruleRows.length!==1?'s':''}</strong>. Review the tables — check approver names and % thresholds match exactly. Also fill in the edge cases box below for OOO handling and expiry rules.`);
      save();
    }
  }catch(e){st.extractErr='Could not reach AI.';}
  st.extractLoading=false;render();
}

async function analyzePricingCalc(){
  if(st.pricingCalcLoading)return;
  st.pricingCalcLoading=true;st.pricingCalcError='';render();

  const sys=`You are a DealHub CPQ specialist analysing a client's pricing calculator, rate card, or pricing spreadsheet. Extract the following and return plain text (no JSON, no markdown):
- Pricing model type (per-seat/user, tiered/volume, flat fee, usage-based, platform + user, or mixed)
- Product lines or families found, with any price points
- Discount tiers or volume bands (e.g. "1-10 seats: $X, 11-50: $Y")
- Multi-year pricing if present (annual uplifts, multi-year discounts)
- Payment terms mentioned (annual, monthly, net days)
- Currency
- Any special pricing rules, formulas, or conditions (e.g. minimum commits, overage rates, pilot pricing)
- Any fields the sales rep must enter vs. auto-calculated fields
Be specific — include actual numbers from the data. Keep output to 10-15 bullet points.`;

  try{
    const parts=[];

    if(st.pricingCalcUrl.trim()){
      parts.push({type:'text',text:`Pricing calculator / spreadsheet URL provided: ${st.pricingCalcUrl.trim()}\nNote this URL and reference it in the pricing analysis.`});
    }

    for(const file of _pricingFileObjects){
      const ext=(file.name.split('.').pop()||'').toLowerCase();
      if(ext==='pdf'){
        const b64=await new Promise((res,rej)=>{const r=new FileReader();r.onload=e=>res(e.target.result.split(',')[1]);r.onerror=rej;r.readAsDataURL(file);});
        parts.push({type:'document',source:{type:'base64',media_type:'application/pdf',data:b64}});
        parts.push({type:'text',text:`(above document: ${file.name})`});
      } else if(['xlsx','xls'].includes(ext)){
        const buf=await file.arrayBuffer();
        const text=await extractFileText(file.name,buf);
        if(text) parts.push({type:'text',text:`=== ${file.name} ===\n${text.slice(0,12000)}`});
      } else {
        const text=await file.text();
        parts.push({type:'text',text:`=== ${file.name} ===\n${text.slice(0,12000)}`});
      }
    }

    if(!parts.length){
      st.pricingCalcAnalysis=`Pricing URL noted: ${st.pricingCalcUrl.trim()}\n\nNo files uploaded — pricing analysis will reference the URL only. Upload a spreadsheet or PDF for a full extraction.`;
      st.pricingCalcLoading=false;save();render();return;
    }

    parts.push({type:'text',text:'Analyse the above pricing data and extract the pricing structure notes.'});

    const res=await fetch(PX,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({
      model:'claude-haiku-4-5-20251001',max_tokens:1000,system:sys,
      messages:[{role:'user',content:parts}]
    })});
    const d=await res.json();
    if(d.error)throw new Error(d.error.message||JSON.stringify(d.error));
    st.pricingCalcAnalysis=((d.content&&d.content[0]?d.content[0].text:'')||'No content extracted').trim();
  }catch(e){
    st.pricingCalcError='Could not analyse: '+e.message;
  }
  st.pricingCalcLoading=false;save();render();
}
