function detectCtxWarnings(){
  if(!st.addCtx||!st.addCtx.trim())return[];
  const ctx=st.addCtx.toLowerCase();
  const warnings=[];
  const ucOn=new Set(st.useCases.filter(u=>u.on).map(u=>u.k));
  const pm=st.pricingModels||[];

  // Pricing model gaps
  if(/per[\s-]?(seat|user|license|agent|person|head)/.test(ctx)&&!pm.includes('per_user'))
    warnings.push('You mentioned per-seat/user pricing — select it under pricing models (Step 3)');
  if(/tier(ed|s)?[\s-]pricing|volume[\s-]discount|tier[\s-]based/.test(ctx)&&!pm.includes('tiered'))
    warnings.push('You mentioned tiered pricing — select it under pricing models (Step 3)');
  if(/usage[\s-]based|metered|consumption|pay[\s-]as[\s-]you[\s-]go/.test(ctx)&&!pm.includes('per_transaction'))
    warnings.push('You mentioned usage-based pricing — select it under pricing models (Step 3)');
  if(/flat[\s-](fee|rate|price)|fixed[\s-](fee|rate|price)/.test(ctx)&&!pm.includes('flat'))
    warnings.push('You mentioned flat fee pricing — select it under pricing models (Step 3)');
  if(/platform[\s-]plus|platform[\s-]&[\s-]user|platform fee/.test(ctx)&&!pm.includes('platform_plus_user'))
    warnings.push('You mentioned platform + user pricing — select it under pricing models (Step 3)');

  // Use case gaps
  [{p:/multi[\s-]?year|\b[23456][\s-]?year[\s-]?(deal|contract|term)|annual uplift|cpi[\s%]/,k:'multiyear',l:'multi-year contracts'},
   {p:/\bpartner\b|reseller|channel[\s-]partner|distributor|\bvar\b/,k:'partners',l:'partner/reseller deals'},
   {p:/ramp[\s-]?(up|ing|ed)?\b|ramping/,k:'ramp',l:'ramp-up pricing'},
   {p:/docusign|e[\s-]?sign(ature)?|electronic[\s-]sign|esignature/,k:'docusign',l:'DocuSign / e-signature'},
   {p:/\btrial\b|\bpilot\b|\bpoc\b|proof[\s-]of[\s-]concept/,k:'trials',l:'trials & pilots'},
   {p:/marketplace|appexchange|app exchange|aws[\s-]marketplace|azure[\s-]marketplace/,k:'marketplace',l:'marketplace sales'},
   {p:/redlin(e|ing)|contract[\s-]markup|contract[\s-]negotiat/,k:'redline',l:'contract redlining'},
   {p:/overage|usage[\s-]limit|consumption[\s-]cap/,k:'overage',l:'usage & overages'},
   {p:/optional[\s-]add[\s-]?on|add[\s-]on product|optional product/,k:'optional',l:'optional add-ons'},
   {p:/\bslack\b|\berp\b|\bsso\b|single[\s-]sign[\s-]on/,k:'integrations',l:'other integrations'},
  ].forEach(({p,k,l})=>{
    if(p.test(ctx)&&!ucOn.has(k))
      warnings.push(`You mentioned ${l} — enable it in use cases (Step 3)`);
  });

  // Product catalog missing
  if(/\bsku\b|\bskus\b|product[\s-]catalog|product[\s-]list|price[\s-]?book|product line|product famil/.test(ctx)&&st.skuCount===0)
    warnings.push('You mentioned products/SKUs — upload your catalog in Step 2 so the design doc reflects your product structure');

  // Approval thresholds described but none entered
  if(/\d+\s*%|approval threshold|sign[\s-]off|approver|discount limit|approval matrix/.test(ctx)&&st.approvalRows.length===0)
    warnings.push('You described approval thresholds — add them to the approval matrix in Step 5 so they appear in the design doc');

  return warnings;
}

function processFile(file){
  if(!/\.(xlsx|xls|csv)$/i.test(file.name)){alert('Please upload .xlsx, .xls, or .csv');return;}
  const r=new FileReader();
  r.onload=e=>{
    try{
      const wb=XLSX.read(new Uint8Array(e.target.result),{type:'array'});
      const json=XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]],{defval:''});
      if(!json.length){showMsg('skuMsg','File appears empty',1);return;}
      st.skus=json.map(row=>({id:uid(),...row}));
      st.skuFile=file.name;st.skuCount=json.length;
      // Auto-detect column mappings
      const keys=Object.keys(json[0]||{});
      const findCol=(patterns)=>keys.find(k=>patterns.some(p=>k.toLowerCase().includes(p)))||'';
      st.colMap={
        sku:findCol(['sku','code','id','product code']),
        name:findCol(['name','product name','description']),
        price:findCol(['price','list','msrp','rate']),
        uom:findCol(['uom','unit','measure']),
        family:findCol(['family','category','group','type']),
        type:findCol(['type','kind','class']),
      };
      save();render();
      analyseProducts();
    }catch(err){showMsg('skuMsg',err.message,1);}
  };
  r.readAsArrayBuffer(file);
}

async function analyseProducts(){
  st.productInsightLoading=true;render();
  const familyCol=st.colMap.family||st.colMap.type||'';
  const families=familyCol?[...new Set(st.skus.map(s=>s[familyCol]).filter(Boolean))].slice(0,8):[];
  const sample=st.skus.slice(0,30).map(s=>Object.values(s).filter(v=>v&&v!=='id').slice(0,5).join(' | ')).join('\n');
  const sys=`You are a DealHub CPQ architect. Analyse this product catalog. Write 2-3 sentences: number of product families (list them by name if detectable), primary pricing model(s), billing types (one-time vs recurring). End with one specific sentence about what question group structure this suggests for DealHub.
Then, ONLY if applicable, add up to 2 short flag sentences (skip entirely if neither applies — do not force a flag that isn't there):
- Bundle flag: if any SKU name/description suggests a packaged/suite offering (words like "Suite", "Bundle", "Package", or a single price covering what reads as multiple components), name it and note it should be modelled as a DealHub Bundle, not a flat product.
- Volume/tiered pricing flag: if the data suggests pricing that changes by quantity or volume (tier language, breakpoints, "per additional unit" patterns), note it should be modelled as a DealHub Discount Table, not a manual per-question field.
Plain prose only, no markdown, no headers.`;
  try{
    const res=await fetch(PX,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({model:'claude-haiku-4-5-20251001',max_tokens:200,system:sys,messages:[{role:'user',content:`${st.skuCount} SKUs. Detected families: ${families.join(', ')||'unclear'}.\n${sample}`}]})});
    const d=await res.json();
    if(!d.error){
      st.productInsight=(d.content&&d.content[0]?d.content[0].text:'')||'';
      // Auto-populate product families if empty
      if(!st.productFamilies&&families.length) st.productFamilies=families.join(', ');
      pushAI(`I've analysed your catalog — <strong>${st.skuCount} SKUs</strong> loaded. ${st.productInsight} Check the <em>product families</em> and <em>pricing model</em> fields below are accurate.`);
      save();
    }
  }catch(e){}
  st.productInsightLoading=false;render();
}

function readAsBase64(file){
  return new Promise((res,rej)=>{
    const r=new FileReader();
    r.onload=e=>res(e.target.result.split(',')[1]);
    r.onerror=rej;
    r.readAsDataURL(file);
  });
}

async function extractFileText(name, buf){
  const ext=(name.split('.').pop()||'').toLowerCase();
  if(['xlsx','xls','csv'].includes(ext)){
    const wb=XLSX.read(new Uint8Array(buf),{type:'array'});
    const lines=[];
    wb.SheetNames.forEach(sn=>{
      const ws=wb.Sheets[sn];
      const rows=XLSX.utils.sheet_to_json(ws,{header:1,defval:''});
      lines.push(`=== ${name} / Sheet: ${sn} ===`);
      rows.forEach(r=>{ if(r.some(c=>String(c).trim())) lines.push(r.map(c=>String(c)).join('\t')); });
    });
    return lines.join('\n');
  }
  if(['txt','md','html','htm','csv'].includes(ext)){
    return new TextDecoder().decode(buf);
  }
  return null;
}

async function startImport(file){
  const MAX=10*1024*1024;
  if(file.size>MAX){st.importError='File too large — please use a file under 10 MB.';render();return;}
  const ext=(file.name.split('.').pop()||'').toLowerCase();
  if(!['pdf','txt','md','html','htm','xlsx','xls','csv','zip'].includes(ext)){
    st.importError='Please use a PDF, Excel/CSV, TXT, Markdown, or ZIP file.';render();return;
  }
  st.importFile=file.name;st.importLoading=true;st.importError='';render();

  const sys=`You are a DealHub CPQ discovery specialist. Analyse the document and extract CPQ configuration information. Return ONLY a valid JSON object — no markdown, no explanation, no trailing text.
Include only fields where you found clear evidence (omit or use "" if unknown):
{"co":"company name","industry":"vertical e.g. SaaS","crm":"Salesforce|HubSpot|Microsoft Dynamics|Other","contractLength":"12|24|36|custom","goLive":"target date or quarter","adminName":"","adminEmail":"","addCtx":"2-3 sentence summary of pain points and goals","pricingModels":["per_user|flat|tiered|platform_plus_user|per_transaction|custom"],"productFamilies":"comma-separated product family names","quoteCreators":"who builds quotes","sellingFlow":"quoting process description","approvalText":"approval workflow description","payTerms":"","netDays":"","autoRenew":"","msa":"","useCases":["multiyear|ramp|partners|trials|overage|optional|cpi|redline|docusign|marketplace|custom|integrations"]}`;

  try{
    let messages;
    if(ext==='zip'){
      const zip=await JSZip.loadAsync(await file.arrayBuffer());
      const parts=[];
      const entries=Object.values(zip.files).filter(f=>!f.dir);
      for(const entry of entries){
        const eName=entry.name.split('/').pop();
        const eExt=(eName.split('.').pop()||'').toLowerCase();
        if(!['pdf','txt','md','html','htm','xlsx','xls','csv'].includes(eExt)) continue;
        if(eExt==='pdf'){
          // PDFs inside ZIP: send as base64 document
          const b64=await entry.async('base64');
          parts.push({type:'document',source:{type:'base64',media_type:'application/pdf',data:b64}});
          parts.push({type:'text',text:`(above: ${eName})`});
        } else {
          const buf=await entry.async('arraybuffer');
          const text=await extractFileText(eName,buf);
          if(text) parts.push({type:'text',text:`=== FILE: ${eName} ===\n${text.slice(0,10000)}`});
        }
        if(parts.length>=20) break;
      }
      if(!parts.length){st.importError='No supported files found inside the ZIP (PDF, Excel, CSV, TXT).';st.importLoading=false;render();return;}
      parts.push({type:'text',text:'Extract all CPQ-relevant information from the above files.'});
      messages=[{role:'user',content:parts}];
    } else if(ext==='pdf'){
      const b64=await readAsBase64(file);
      messages=[{role:'user',content:[
        {type:'document',source:{type:'base64',media_type:'application/pdf',data:b64}},
        {type:'text',text:'Extract all CPQ-relevant information from this document.'}
      ]}];
    } else if(['xlsx','xls','csv'].includes(ext)){
      const buf=await file.arrayBuffer();
      const text=await extractFileText(file.name,buf);
      messages=[{role:'user',content:'Extract all CPQ-relevant information from this spreadsheet.\n\nSPREADSHEET:\n'+text.slice(0,30000)}];
    } else {
      const text=await file.text();
      messages=[{role:'user',content:'Extract all CPQ-relevant information from this document.\n\nDOCUMENT:\n'+text.slice(0,30000)}];
    }
    const res=await fetch(PX,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({
      model:'claude-haiku-4-5-20251001',max_tokens:1500,system:sys,messages
    })});
    const d=await res.json();
    if(d.error)throw new Error(d.error.message||JSON.stringify(d.error));
    const raw=((d.content&&d.content[0]?d.content[0].text:'')||'').replace(/```json|```/g,'').trim();
    const parsed=JSON.parse(raw);
    applyImportData(parsed);
    st.importDone=true;
  }catch(e){
    st.importError='Could not analyse document: '+e.message;
  }
  st.importLoading=false;
  save();render();
}

function applyImportData(p){
  if(p.co){st.co=p.co;const el=document.getElementById('coInp');if(el)el.value=st.co;}
  if(p.industry)st.industry=p.industry;
  if(p.crm&&['Salesforce','HubSpot','Microsoft Dynamics','Other'].includes(p.crm))st.crm=p.crm;
  if(p.contractLength)st.contractLength=String(p.contractLength);
  if(p.goLive)st.goLive=p.goLive;
  if(p.adminName)st.adminName=p.adminName;
  if(p.adminEmail)st.adminEmail=p.adminEmail;
  if(p.addCtx)st.addCtx=p.addCtx;
  if(p.pricingModels&&p.pricingModels.length){st.pricingModels=p.pricingModels;st.pricingModel=p.pricingModels.join(',');}
  if(p.productFamilies)st.productFamilies=p.productFamilies;
  if(p.quoteCreators)st.quoteCreators=p.quoteCreators;
  if(p.sellingFlow)st.sellingFlow=p.sellingFlow;
  if(p.approvalText)st.approvalText=p.approvalText;
  if(p.payTerms)st.payTerms=p.payTerms;
  if(p.netDays)st.netDays=p.netDays;
  if(p.autoRenew)st.autoRenew=p.autoRenew;
  if(p.msa)st.msa=p.msa;
  if(p.useCases&&Array.isArray(p.useCases)&&p.useCases.length){
    st.useCases=st.useCases.map(u=>p.useCases.includes(u.k)?{...u,on:true}:u);
  }
}

async function genDoc(){
  st.docGenerating=true;st.docError='';st.docStatus='';render();
  const en=st.useCases.filter(u=>u.on);
  const matrix=st.approvalRows.map(r=>`${r.role}: up to ${r.max} → ${r.approver}`).join('\n');
  const rules=st.ruleRows.filter(r=>r.rule).map(r=>`${r.rule} → Step1: ${r.step1}${r.step2?' → Step2: '+r.step2:''}`).join('\n');
  // Full product list — no truncation, cap only by character budget
  const skuRows=st.skus.map(s=>{
    const sku=st.colMap.sku?s[st.colMap.sku]:'';
    const name=st.colMap.name?s[st.colMap.name]:'';
    const price=st.colMap.price?s[st.colMap.price]:'';
    const family=st.colMap.family?s[st.colMap.family]:'';
    const type=st.colMap.type?s[st.colMap.type]:'';
    return [sku,name,price,family,type].filter(Boolean).join(' | ');
  });
  const skuFallbackRows=st.skus.map(s=>Object.values(s).filter(v=>v&&v!=='id').slice(0,6).join(' | '));
  const skuLines=skuRows.some(r=>r.trim())?skuRows:skuFallbackRows;
  // Budget 12000 chars for products to leave room for rest of context
  let skuSample='',budget=12000;
  for(const row of skuLines){if(skuSample.length+row.length>budget){skuSample+=`\n… (${skuLines.length-skuLines.indexOf(row)} more products — all included in your uploaded catalog)`;break;}skuSample+=row+'\n';}
  skuSample=skuSample.trim()||'No products uploaded';

  const crmDetail=st.crm==='Salesforce'?`Salesforce — Object: ${st.sfObject}`:
    st.crm==='HubSpot'?`HubSpot — Edition: ${st.crmEdition||'unknown'}`:st.crm;

  const ctx=`CLIENT: ${st.co||'(not specified)'}

Approval Workflows vs Validation Rules — three distinct mechanisms, do not merge them:
- General Workflow: hierarchical approval by role/threshold from the discount matrix — escalates automatically when a rep exceeds their limit.
- Rule-Based Workflow: event-condition → fixed approver routing. Not role-based. Use for special conditions (product type, deal type, terms).

  const DOC_MODEL='claude-sonnet-4-6'; // flagship deliverable — use the stronger model, not Haiku
  const RETRY_WAIT=65000; // 65s clears the 1-min rate limit window

  async function docCall(body, label){
    const run=async()=>{
      const res=await fetch(PX,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)});
      const text=await res.text();
      if(res.status===429){
        // Show countdown to user, then retry once
        for(let s=65;s>0;s--){
          st.docStatus=`Rate limit hit — retrying in ${s}s…`;render();
          await new Promise(r=>setTimeout(r,1000));
        }
        st.docStatus='';render();
        const res2=await fetch(PX,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)});
        const text2=await res2.text();
        if(!res2.ok) throw new Error(`HTTP ${res2.status}: ${text2.slice(0,200)}`);
        return text2;
      }
      if(!res.ok) throw new Error(`HTTP ${res.status}: ${text.slice(0,200)}`);
      return text;
    };
    return run();
  }

  try{
    const stripFences=s=>s.replace(/^```[\w]*\r?\n?/,'').replace(/\r?\n?```\s*$/,'').trim();
    const truncatedParts=[];
    const parseCall=(text,label)=>{
      let d;
      try{d=JSON.parse(text);}catch(pe){throw new Error(`Bad JSON (${label}): ${text.slice(0,150)}`);}
      if(d.error)throw new Error(typeof d.error==='string'?d.error:(d.error.message||JSON.stringify(d.error)));
      // Backstop: if the model hit the token ceiling, the section is cut off mid-content.
      // Flag it so the doc viewer can warn instead of silently shipping a half-written section.
      if(d.stop_reason==='max_tokens')truncatedParts.push(label);
      return stripFences((d.content&&d.content[0]?d.content[0].text:'')||'');
    };

    // 3 independent calls — each covers ~2-3 sections. They don't depend on each other,
    // so fire them concurrently (≈35s) instead of sequentially (≈100s).
    st.docStatus='Generating all 8 sections…';render();
    const p1=docCall({model:DOC_MODEL,max_tokens:8000,system:sys,messages:[{role:'user',content:`Generate the Stakeholders table followed by these 3 sections of the CPQ Business Process Discovery & Design Document:\n1. "Context & The Why"\n2. "Goals & Success Criteria"\n3. "Go-To-Market Structure"\n\nUse the exact section titles. No other titles. Only use information from the context.\n\nCONTEXT:\n${ctx}`}]},'Part 1');

    const p2=docCall({model:DOC_MODEL,max_tokens:8000,system:sys,messages:[{role:'user',content:`Generate these 3 sections of the CPQ Business Process Discovery & Design Document:\n4. "Current State: How It Works Today"\n5. "Products & Pricing"\n6. "DealHub Configuration Design"\n\nSection 5: include EVERY product from the SKU SAMPLE exactly — no omissions.\nSection 6: use EXACT product family names from the SKU data as question group IDs. Include full question tables.\nDo not invent any values.\n\nCONTEXT:\n${ctx}`}]},'Part 2');

    const p3=docCall({model:DOC_MODEL,max_tokens:8000,system:sys,messages:[{role:'user',content:`Generate these 2 sections of the CPQ Business Process Discovery & Design Document:\n7. "Approval Workflows"\n8. "Output Documents, DealRoom & Build Sequence"\n\nSection 7: use exact roles and thresholds from DISCOUNT MATRIX. If empty, flag as ACTION REQUIRED.\nSection 8: include a full 10-step build sequence table and a risks table.\nDo not invent any values.\n\nCONTEXT:\n${ctx}`}]},'Part 3');

    const [text1,text2,text3]=await Promise.all([p1,p2,p3]);
    const c1=parseCall(text1,'Part 1');
    const c2=parseCall(text2,'Part 2');
    const c3=parseCall(text3,'Part 3');
    const docContent=c1+'\n'+c2+'\n'+c3;
    st.docGenerating=false;st.docError='';st.docStatus='';
    st.docTruncated=truncatedParts.length?truncatedParts.slice():null;
    if(st.docTruncated)showToast(truncatedParts.join(', ')+' may be cut off — regenerate to retry','warning');
    // Append a new version — never overwrite. Every past draft stays reachable from the
    // version history list and from the doc viewer's version switcher.
    const verEntry={id:uid()+uid(),versionNumber:(st.docVersions?st.docVersions.length:0)+1,
      raw:docContent,html:buildDocPage(docContent,false),createdAt:Date.now()};
    st.docVersions=[...(st.docVersions||[]),verEntry];
    st.lastDocRaw=verEntry.raw;
    st.lastDocHtml=verEntry.html;
    save();render();
    await syncToDb(st.submitted); // immediate, not the 2s-debounced save() — the new tab needs this NOW
    openDocViewer(verEntry.versionNumber);
  }catch(e){st.docError='Could not reach AI: '+e.message;st.docGenerating=false;render();}
}

// Opens the shareable, reloadable doc viewer in a new tab (?id=<dbId>&view=doc&v=<n>).
// Replaces the old window.open('','_blank')+document.write pattern, which produced a
// blank-URL tab that couldn't be reloaded, bookmarked, or shared for commenting.
function openDocViewer(versionNumber){
  const base=window.location.origin+window.location.pathname;
  const url=`${base}?id=${st.dbId}&view=doc${versionNumber?('&v='+versionNumber):''}`;
  window.open(url,'_blank');
}

function downloadDoc(htmlOverride){
  const html=htmlOverride||st.lastDocHtml||(st.lastDocRaw?buildDocPage(st.lastDocRaw,false):'');
  if(!html){alert('Generate the design document first.');return;}
  const co=(st.co||'Client').replace(/\s+/g,'_');
  const b=new Blob([html],{type:'text/html'});
  const a=document.createElement('a');
  a.href=URL.createObjectURL(b);
  a.download=`DealHub_Design_Doc_${co}_${new Date().toISOString().slice(0,10)}.html`;
  a.click();
}

function downloadDocPDF(htmlOverride,btnId){
  const html=htmlOverride||st.lastDocHtml||(st.lastDocRaw?buildDocPage(st.lastDocRaw,false):'');
  if(!html){alert('Generate the design document first.');return;}
  // Native browser print → "Save as PDF". Reliable, selectable text, correct A4 pagination.
  // The previous html2canvas raster path produced BLANK pages: a ~10,000px-tall doc at
  // scale 2 exceeds the browser's max canvas size, so html2canvas returned an empty canvas
  // and jsPDF emitted a single blank page. The doc HTML (buildDocPage) already carries
  // @page/A4 print CSS, so we just open it and let the browser render + print it natively.
  const w=window.open('','_blank');
  if(!w){alert('Please allow pop-ups for this site, then click PDF again to export.');return;}
  w.document.write(html);
  w.document.close();
  let printed=false;
  const doPrint=()=>{if(printed)return;printed=true;try{w.focus();w.print();}catch(e){}};
  // Print once fonts + layout settle; fallback covers onload already having fired.
  w.onload=()=>setTimeout(doPrint,400);
  setTimeout(doPrint,1200);
}

// ── DOC VIEWER + PER-SECTION COMMENTS ───────────────────────────────────────
// Reached via ?id=<dbId>&view=doc[&v=N] (see openDocViewer / initApp). A real, reloadable,
// shareable page — not a blank window.open+document.write tab — so a version can be
// bookmarked and commented on by anyone with the link.
let docViewerVersion=null;   // version number currently shown in the iframe
const openCommentSections=new Set(); // which of the 8 section accordions are expanded

function getDocVersionsList(){
  // Legacy discoveries saved before docVersions existed only have lastDocHtml — synthesize
  // a single v1 entry from it so the viewer still works for old links.
  if(st.docVersions&&st.docVersions.length)return st.docVersions;
  return (st.lastDocRaw||st.lastDocHtml)?[{id:'legacy',versionNumber:1,raw:st.lastDocRaw,html:st.lastDocHtml||'',createdAt:Date.now()}]:[];
}
function resolveDocVersion(versionNumber){
  const list=getDocVersionsList();
  if(!list.length)return null;
  return (versionNumber&&list.find(v=>v.versionNumber===versionNumber))||list[list.length-1];
}
// Rendered HTML is fully derivable from `raw` via buildDocPage(), so we don't persist it
// (see saveState). verHtml() returns the stored html if present (in-memory this session) or
// rebuilds it from raw (after a reload / DB resume).
function verHtml(v){ return v ? (v.html || (v.raw ? buildDocPage(v.raw,false) : '')) : ''; }
function docVersionHtml(){
  const v=resolveDocVersion(docViewerVersion);
  return v?verHtml(v):(st.lastDocHtml||(st.lastDocRaw?buildDocPage(st.lastDocRaw,false):''));
}
function getCommenterName(){try{return localStorage.getItem('dh_commenter_name')||''}catch(e){return '';}}

// Which of the 8 fixed sections read differently between two version HTML strings — cheap
// "what changed" signal without a real text-diff library. Relies on the same `.section`
// DOM contract the genDoc() sys prompt enforces (see DOC_SECTIONS).
function diffSectionsChanged(prevHtml,curHtml){
  const changed=new Set();
  try{
    const a=Array.from(new DOMParser().parseFromString(prevHtml,'text/html').querySelectorAll('.section')).map(s=>(s.textContent||'').trim());
    const b=Array.from(new DOMParser().parseFromString(curHtml,'text/html').querySelectorAll('.section')).map(s=>(s.textContent||'').trim());
    for(let i=0;i<Math.max(a.length,b.length);i++)if((a[i]||'')!==(b[i]||''))changed.add(i);
  }catch(e){/* leave changed empty on any parse failure */}
  return changed;
}

function renderDocViewer(versionNumber){
  document.getElementById('prog').innerHTML='';
  document.getElementById('footer').innerHTML='';
  const list=getDocVersionsList();
  const v=resolveDocVersion(versionNumber);
  const el=document.getElementById('content');
  if(!v){
    el.innerHTML='<div class="card" style="padding:48px;text-align:center;color:var(--text-secondary)">No design document has been generated for this discovery yet.</div>';
    return;
  }
  docViewerVersion=v.versionNumber;
  const prevV=list.find(x=>x.versionNumber===v.versionNumber-1);
  docViewerChangedSections=prevV?diffSectionsChanged(verHtml(prevV),verHtml(v)):new Set();

// Sections that differ from the previous version — set by renderDocViewer() via
// diffSectionsChanged(); read here to draw the "● changed" marker on section titles.
let docViewerChangedSections=new Set();

function renderCommentSection(i,title){
  const list=(st.comments||[]).filter(c=>c.section===i).sort((a,b)=>a.createdAt-b.createdAt);
  const unresolved=list.filter(c=>!c.resolved);

function toggleCommentSection(i){
  if(openCommentSections.has(i))openCommentSections.delete(i);else openCommentSections.add(i);
  const panels=document.getElementById('commentPanels');
  if(panels)panels.innerHTML=DOC_SECTIONS.map((t,idx)=>renderCommentSection(idx,t)).join('');
}
// Shared by addComment/toggleCommentResolved — re-fetch the latest comments before mutating,
// a cheap guard against clobbering a concurrent commenter's post (syncToDb is a full-row
// upsert with no server-side merge).
async function refreshCommentsFromDb(){
  try{
    const fresh=await sbLoad(st.dbId);
    if(fresh&&fresh.state&&Array.isArray(fresh.state.comments))st.comments=fresh.state.comments;
  }catch(e){/* */}
}
async function toggleCommentResolved(commentId){
  await refreshCommentsFromDb();
  st.comments=(st.comments||[]).map(c=>c.id===commentId?{...c,resolved:!c.resolved}:c);
  const panels=document.getElementById('commentPanels');
  if(panels)panels.innerHTML=DOC_SECTIONS.map((t,idx)=>renderCommentSection(idx,t)).join('');
  await syncToDb(st.submitted);
}
async function addComment(i){
  const nameInp=document.getElementById('cname-'+i);
  const textInp=document.getElementById('ctext-'+i);
  const author=(nameInp&&nameInp.value||'').trim();
  const text=(textInp&&textInp.value||'').trim();
  if(!author){alert('Enter your name first.');nameInp&&nameInp.focus();return;}
  if(!text)return;
  try{localStorage.setItem('dh_commenter_name',author);}catch(e){/* */}
  await refreshCommentsFromDb();
  st.comments=[...(st.comments||[]),{id:uid()+uid(),section:i,author,text,createdAt:Date.now(),resolved:false}];
  openCommentSections.add(i);
  const panels=document.getElementById('commentPanels');
  if(panels)panels.innerHTML=DOC_SECTIONS.map((t,idx)=>renderCommentSection(idx,t)).join('');
  await syncToDb(st.submitted); // immediate — other viewers of this link should see it right away
}

async function analyzeTranscript(){
  if(!st.transcriptRaw.trim())return;
  st.transcriptLoading=true;st.transcriptError='';render();
  const sys=`You are a senior DealHub Solution Architect. Extract structured insights from a B2B SaaS discovery call transcript to inform a DealHub CPQ Configuration Design Document.

Return ONLY valid JSON, no markdown fences, no preamble:
{"observations":[{"currentState":"what they currently do","painPoint":"the problem this causes"}],"quotes":[{"speaker":"name or Client","quote":"verbatim quote max 25 words"}],"implications":[{"observation":"what was said","configImpact":"specific DealHub config response","section":"e.g. S4 Playbook"}],"useCaseSuggestions":["key1"]}

Valid useCaseSuggestions keys: multiyear,ramp,partners,trials,overage,optional,cpi,redline,docusign,marketplace,custom,integrations
Rules: 3-6 observations, 3-6 quotes, 4-8 implications. Be specific — use real numbers/names from the transcript. If irrelevant or empty, return empty arrays.`;

  try{
    const res=await fetch(PX,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({
      model:'claude-haiku-4-5-20251001',max_tokens:2000,system:sys,
      messages:[{role:'user',content:`Extract insights from this discovery transcript:\n\n${st.transcriptRaw.slice(0,8000)}`}]
    })});
    const text=await res.text();
    if(!res.ok){st.transcriptError=`HTTP ${res.status}`;st.transcriptLoading=false;render();return;}
    const d=JSON.parse(text);
    if(d.error){st.transcriptError=typeof d.error==='string'?d.error:(d.error.message||'API error');st.transcriptLoading=false;render();return;}
    const raw=(d.content&&d.content[0]?d.content[0].text:'')||'';
    const clean=raw.replace(/^```json\n?/,'').replace(/\n?```$/,'').trim();
    const parsed=JSON.parse(clean);
    st.rdsObservations=parsed.observations||[];
    st.rdsQuotes=parsed.quotes||[];
    st.rdsImplications=parsed.implications||[];
    st.rdsUseCaseSuggestions=parsed.useCaseSuggestions||[];
    st.transcriptApplied=false;
  }catch(e){
    st.transcriptError=String(e.message||'Parse error');
  }
  st.transcriptLoading=false;
  save();render();
}

function applyTranscript(){
  if(!st.rdsObservations.length&&!st.rdsQuotes.length)return;
  const obsSummary=st.rdsObservations.map(o=>`${o.currentState} — Pain: ${o.painPoint}`).join('\n');
  if(obsSummary&&!st.sellingFlow.includes('[From transcript]')){
    st.sellingFlow=(st.sellingFlow?st.sellingFlow+'\n\n':'')+'[From transcript]\n'+obsSummary;
  }
  st.rdsUseCaseSuggestions.forEach(k=>{
    st.useCases=st.useCases.map(u=>u.k===k?{...u,on:true}:u);
  });
  st.transcriptApplied=true;
  save();render();
}

async function genProjectPlan(){
  // Snapshot the plan being superseded (if any) — appended to planVersions on success below.
  // Manual inline edits between regenerations are NOT separately versioned, only each
  // completed generate/regenerate is — same model as the design doc's versioning.
  const prevPlan=(st.projectPlan&&st.projectPlan.length)?st.projectPlan:null;
  st.planLoading=true;st.planError='';render();
  const en=st.useCases.filter(u=>u.on);
  const ctx=`Client: ${st.co||'unknown'} | Go-live: ${st.goLive||'TBD'} | CRM: ${st.crm} | Industry: ${st.industry||'unknown'} | Contract: ${st.contractLength||'12'}mo | Products: ${st.productFamilies||'unknown'} | Pricing: ${st.pricingModel||'unknown'} | Use cases: ${en.map(u=>u.n).join(', ')||'none'} | DocuSign: ${en.some(u=>u.k==='docusign')?'Yes':'No'}`;

  const sys=`You are a DealHub CPQ implementation manager. Output a JSON array only — no markdown, no explanation, no text before or after the array. Output compact JSON with NO line breaks or indentation inside the array.
STRICT JSON RULES: use double quotes for ALL keys and string values. Never use single quotes. Never leave keys unquoted. Valid booleans: true/false (no quotes).
Schema: {"phase":"string","task":"string","owner":"DH or Client or Both","start":"Week N","end":"Week N","priority":"High or Medium or Low","milestone":false,"notes":"string"}
notes: key dependency or action required, max 8 words, no apostrophes. Empty string if none.
Generate exactly 22 tasks across these phases (task count): Discovery & Design (4), Integration Setup (3), Product Catalog (3), Approval Workflows (2), DealRoom & Docs (2), UAT (4), Training (2), Go-Live (2).
Set milestone:true for exactly these 9 tasks: Kickoff Meeting, Discovery Complete, Integration Complete, Catalog Config Complete, Approval Workflows Complete, DealRoom & Docs Complete, UAT Start, Training Complete, Go-Live.
DH owns build/config. Client owns sign-offs, data provision, UAT execution. Both for workshops and kickoff.
Tailor task names and notes to the client context provided.`;

  try{
    const reqBody=JSON.stringify({model:'claude-haiku-4-5-20251001',max_tokens:2000,system:sys,messages:[{role:'user',content:ctx}]});
    let res=await fetch(PX,{method:'POST',headers:{'Content-Type':'application/json'},body:reqBody});
    if(res.status===429){
      st.planError='Rate limit — retrying in 60 seconds…';render();
      await new Promise(r=>setTimeout(r,62000));
      st.planError='';
      res=await fetch(PX,{method:'POST',headers:{'Content-Type':'application/json'},body:reqBody});
    }
    const text=await res.text();
    if(!res.ok){st.planError=`HTTP ${res.status}: ${text.slice(0,200)}`;st.planLoading=false;render();return;}
    let d;
    try{d=JSON.parse(text);}catch(pe){st.planError=`Bad JSON: ${text.slice(0,200)}`;st.planLoading=false;render();return;}
    if(d.error){st.planError=typeof d.error==='string'?d.error:(d.error.message||JSON.stringify(d.error));st.planLoading=false;render();return;}
    const raw=((d.content&&d.content[0]?d.content[0].text:'')||'').replace(/```json|```/g,'').trim();
    if(!raw){st.planError='Empty response — try again';st.planLoading=false;render();return;}
    console.log('genProjectPlan raw response:', raw);
    try {
      const jsonStr = raw.match(/\[[\s\S]*\]/)?.[0] || raw;
      // Try 1: plain parse
      try { st.projectPlan = JSON.parse(jsonStr); }
      catch(e1) {
        // Try 2: fix trailing commas + unquoted keys
        const c2 = jsonStr
          .replace(/,(\s*[}\]])/g,'$1')
          .replace(/([{,]\s*)([a-zA-Z_][a-zA-Z0-9_]*)(\s*):/g,'$1"$2"$3:');
        try { st.projectPlan = JSON.parse(c2); }
        catch(e2) {
          // Try 3: normalise curly quotes
          const c3 = c2.replace(/[""]/g,'"').replace(/['']/g,"'");
          try { st.projectPlan = JSON.parse(c3); }
          catch(e3) {
            // Try 4: swap remaining single-quote string delimiters
            const c4 = c3.replace(/([:,\[{]\s*)'([^']*)'/g,'$1"$2"');
            st.projectPlan = JSON.parse(c4);
          }
        }
      }
    } catch(e) {
      st.planError = 'Parse error: ' + String(e.message).slice(0,80) + ' — raw: ' + raw.slice(0,120);
      st.planLoading = false;
      render();
      return;
    }
    if(prevPlan){
      st.planVersions=[...(st.planVersions||[]),{id:uid()+uid(),versionNumber:(st.planVersions?st.planVersions.length:0)+1,tasks:prevPlan,createdAt:Date.now()}];
    }
    st.planLoading=false;save();render();
  }catch(e){
    st.planError=`${e.message||e}`;
    st.planLoading=false;render();
  }
}

function exportPlanXlsx(){
  if(!st.projectPlan?.length){alert('Generate a plan first.');return;}
  const wb=XLSX.utils.book_new();
  const ws=XLSX.utils.json_to_sheet(st.projectPlan.map(r=>({Phase:r.phase,Task:r.task,Notes:r.notes||'',Status:r.status||'Not Started',Owner:r.owner,Start:r.start,End:r.end,Priority:r.priority,Milestone:r.milestone?'Yes':''})));
  XLSX.utils.book_append_sheet(wb,ws,'Project Plan');
  XLSX.writeFile(wb,`DealHub_Plan_${(st.co||'Client').replace(/\s+/g,'_')}.xlsx`);
}

function importSave(inp){
  const f=inp.files[0];if(!f)return;
  const r=new FileReader();
  r.onload=e=>{
    try{
      const data=JSON.parse(e.target.result);
      if(data.st){st={...freshSt(),...data.st,dbId:(data.st.dbId||uid()+uid())};saveState();showFormView();render();showToast('Progress loaded');}
      else alert('Invalid save file.');
    }catch(ex){alert('Could not read file: '+ex.message);}
  };
  r.readAsText(f);inp.value='';
}


// ── Init — URL-based resume ──────────────────────────────────────────────────
async function initApp(){
  const params=new URLSearchParams(window.location.search);
  const resumeId=params.get('id');

  // Snapshot this device's saved state BEFORE anything renders. render() auto-persists the
  // current (here: fresh/empty) state via save(), so calling it first would clobber a
  // previously generated doc in localStorage — the fallback below reads this snapshot instead.
  const localSnapshot=(()=>{try{const r=localStorage.getItem(SAVE_KEY);return r?(JSON.parse(r).st||null):null;}catch(e){return null;}})();

  if(resumeId){
    // Show loading state first, then fetch
    render(); // renders step 0 of fresh state while loading
    document.getElementById('content').innerHTML=`<div style="display:flex;align-items:center;justify-content:center;height:60vh;flex-direction:column;gap:14px">
      <span class="spin" style="width:24px;height:24px;border-width:3px"></span>
      <div style="font-size:13px;color:var(--text-secondary)">Loading your saved progress…</div>
    </div>`;
    try{
      const res=await fetch(`${SB_URL}/rest/v1/discoveries?id=eq.${resumeId}&select=*`,{headers:SB_HEADERS});
      const rows=await res.json();
      if(rows&&rows[0]&&rows[0].state){
        st={...freshSt(),...rows[0].state,dbId:resumeId};
        saveState();
        // ?view=doc[&v=N] — a shareable, reloadable link straight into the doc viewer
        // (with per-section comments) instead of the wizard. See openDocViewer().
        if(params.get('view')==='doc'){
          renderDocViewer(Number(params.get('v'))||null);
          return;
        }
        showFormView();
        render();
        showToast('Progress restored from link');
        return;
      }
    }catch(e){console.error('Resume error:',e);}
    // DB unreachable or record missing — fall back to THIS device's saved snapshot so a
    // generated doc is never lost just because the cloud round-trip failed (offline, CORS,
    // key issue). Recipients on another device still need the DB; the owner's copy survives.
    if(localSnapshot&&((localSnapshot.docVersions&&localSnapshot.docVersions.length)||localSnapshot.co)){
      st={...freshSt(),...localSnapshot};
      if(params.get('view')==='doc'&&getDocVersionsList().length){
        renderDocViewer(Number(params.get('v'))||null);
        showToast('Loaded from this device');
        return;
      }
      showFormView();
      render();
      showToast('Loaded from this device (cloud unavailable)');
      return;
    }
    showToast('Could not load saved progress');
    render();
    return;
  }

  // Normal load — land on Home, where every saved form is listed.
  // (The old single-form "Welcome back" banner is obsolete: Home IS the welcome back.)
  showHome();
}
